});

// 13. the budget and the esercizio provvisorio
chart('c13', el => {
  const R = D.c13.rows, cols = S8(), epY = R.filter(r => r.ep.length), lastEp = epY[epY.length - 1].y;
  const upto = R.filter(r => r.y <= lastEp), after = R.filter(r => r.y > lastEp && r.budget);
  const late = after.filter(r => r.days > 0), early = after.reduce((a, b) => (a.days <= b.days ? a : b));
  return {
    title: L(`Esercizio provvisorio: autorizzato per ${fmt(epY.length)} bilanci su ${fmt(upto.length)} fino al ${lastEp}, mai dopo`,
      `Provisional budgets: authorised for ${fmt(epY.length)} of ${fmt(upto.length)} budgets up to ${lastEp}, never since`),
    toc: L('Bilancio ed esercizio provvisorio', 'The budget and provisional budgets'),
    dek: L(`Ogni colonna è un esercizio finanziario: i giorni tra il suo inizio (il 1º luglio fino al 1964, poi il 1º gennaio) e la legge che completa il bilancio dello Stato. Sopra lo zero il bilancio è arrivato in ritardo e una legge ha autorizzato l’esercizio provvisorio (in arancione), che la Costituzione (art. 81) consente per non più di quattro mesi; fino al 1963 il bilancio si chiudeva quasi sempre il 31 ottobre, proprio al limite. Dal ${lastEp + 1} la legge di bilancio è sempre firmata prima del 1º gennaio, quasi sempre nell’ultima settimana di dicembre; la più anticipata è quella ${pD('del', early.budget)}.`,
      `Each column is a financial year: the days between its start (1 July until 1964, then 1 January) and the law completing the State budget. Above zero the budget came late and a law authorised a provisional budget (in orange), which the Constitution (art. 81) allows for no more than four months; until 1963 the budget was nearly always completed on 31 October, right at the limit. Since ${lastEp + 1} the budget law has always been signed before 1 January, nearly always in the last week of December; the earliest was signed on ${dateTxt(early.budget)}.`),
    draw(el) {
      legend(el, [{ c: cols[1], l: L('esercizio provvisorio autorizzato per legge', 'provisional budget authorised by law') }, { c: cols[0], l: L('bilancio approvato senza esercizio provvisorio', 'budget approved without a provisional budget') }]);
      const w = W(el), nwd = narrow(w), h = 300, m = { t: nwd ? 40 : 26, r: 8, b: 26, l: 46 }, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(R.map(r => r.y)).range([0, iw]).padding(0.18);
      const y = d3.scaleLinear().domain([d3.min(R, r => r.days) - 5, d3.max(R, r => r.days) + 10]).nice().range([ih, 0]);
      yAxis(g, y, iw, 6, v => v === 0 ? '0' : (v > 0 ? '+' : '−') + fmt(Math.abs(v)));
      g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(0)).attr('y2', y(0)).attr('stroke', css('--text-3'));
      const y4 = y(121);
      g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y4).attr('y2', y4).attr('stroke', css('--text-2')).attr('stroke-dasharray', '4 3');
      halo(g, iw, y4 - 5, nwd ? L('quattro mesi (art. 81)', 'four months (art. 81)') : L('quattro mesi, il massimo dell’esercizio provvisorio (art. 81)', 'four months, the limit of a provisional budget (art. 81)'), 'end', 'lbl');
      const z0 = L('inizio dell’esercizio', 'start of the financial year');
      halo(g, iw, y(0) - 5, z0, 'end', 'lbl mut');
      g.append('text').attr('class', 'lbl mut').attr('x', 2).attr('y', nwd ? -26 : -10).text(L('giorni dopo l’inizio', 'days after the start'));
      R.forEach(r => {
        if (r.days == null) return;
        const x0 = x(r.y), bw = x.bandwidth(), c0 = r.ep.length ? cols[1] : cols[0];
        g.append('path').attr('d', r.days >= 0 ? colPath(x0, y(0), bw, y(r.days), 2) : colPathDown(x0, y(0), bw, y(r.days), 2)).attr('fill', c0);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - 1).attr('width', bw + 2).attr('y', 0).attr('height', ih).datum(r),
          d => `<b>${L('Esercizio', 'Financial year')} ${d.y < 1965 ? `${d.y}–${String(d.y + 1).slice(2)}` : d.y}${d.y === 1964 ? L(' (secondo semestre)', ' (second half)') : ''}</b>` + trow(null, L('Inizio', 'Start'), dateTxt(d.start)) +
            trow(null, L('Legge di bilancio', 'Budget law'), dateTxt(d.budget)) + trow(null, L('Giorni dall’inizio', 'Days from the start'), (d.days > 0 ? '+' : '') + fmt(d.days)) +
            d.ep.map(e => trow(cols[1], e[1] === 'proroga' ? L('Proroga dell’esercizio provvisorio', 'Provisional budget extended') : L('Esercizio provvisorio autorizzato', 'Provisional budget authorised'), dateTxt(e[0]))).join(''));
      });
      const every = nwd ? 20 : 5;
      R.forEach(r => { if (r.y % every === 0) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(r.y); });
      const xs = x(1965) - x.step() * x.paddingInner() / 2;
      g.append('line').attr('x1', xs).attr('x2', xs).attr('y1', -6).attr('y2', ih).attr('stroke', css('--text-3')).attr('stroke-dasharray', '3 3');
      const t1 = nwd ? L('dal 1965: anno solare', 'from 1965: calendar year') : L('dal 1965 l’esercizio è l’anno solare', 'from 1965 the financial year is the calendar year'), tw = textW(el, [t1], 'lbl mut');
      halo(g, xs + tw + 8 < iw ? xs + 5 : xs - 5, -6, t1, xs + tw + 8 < iw ? 'start' : 'end', 'lbl mut');
      note(el, ['parlamento/schede/leggi/<anno>/<mese>/legge-<n>.md (titolo)'], fmt(R.filter(r => r.budget).length) + L(' leggi di bilancio', ' budget laws'),
        L(`la legge di bilancio è quella intitolata “Bilancio di previsione dello Stato per l’anno finanziario…” (dal 1965); fino al 1963 lo stato di previsione dell’entrata e della spesa del Ministero del tesoro; per il 1964 il bilancio del solo secondo semestre. L’esercizio provvisorio è contato quando nelle leggi c’è un’“Autorizzazione all’esercizio provvisorio del bilancio” per quell’anno; per il 1980 la legge di bilancio è del 30 aprile ma non c’è una legge di esercizio provvisorio.`,
          `the budget law is the one titled "Bilancio di previsione dello Stato per l'anno finanziario…" (from 1965); until 1963 the estimate of revenue and expenditure of the Treasury ministry; for 1964 the budget of the second half year only. A provisional budget is counted when the laws include an "Autorizzazione all'esercizio provvisorio del bilancio" for that year; for 1980 the budget law is dated 30 April but there is no provisional budget law.`));
      table(el, [L('Esercizio', 'Financial year'), L('Legge di bilancio', 'Budget law'), L('Giorni', 'Days'), L('Esercizio provvisorio', 'Provisional budget')], R.map(r => [String(r.y), r.budget || '', r.days == null ? '' : r.days, r.ep.map(e => e[0]).join(', ')]));
    }
  };
});

part('p4', 'IV. La Costituzione e i codici', 'IV. The Constitution and the codes',
  'La Costituzione del 1948 e i quattro codici sono nel repository in tutte le versioni che Normattiva pubblica, un file per articolo: ogni commit dice quali articoli sono cambiati e da quando.',
  'The 1948 Constitution and the four codes are in the repository in every version Normattiva publishes, one file per article: each commit says which articles changed, and from when.');

// 14. the Constitution, article by article
chart('c14', el => {
  const c = D.c14, A = c.arts.filter(a => /\/art-\d+\.md$/.test(a.p)).map(a => ({ ...a, n: +a.p.match(/art-(\d+)/)[1] })).sort((a, b) => a.n - b.n);
  const X = c.arts.filter(a => /allegati\/allegato-/.test(a.p)).map(a => ({ ...a, r: a.p.match(/allegato-([ivxl]+)\.md/)[1].toUpperCase() }));
  const RN = r => ({ I: 1, V: 5, X: 10, L: 50 });
  const rnum = s => { let n = 0, p = 0; for (const ch of s.split('').reverse()) { const v = { I: 1, V: 5, X: 10, L: 50 }[ch]; n += v < p ? -v : v; p = Math.max(p, v); } return n; };
  X.sort((a, b) => rnum(a.r) - rnum(b.r));
  const orig = A.filter(a => !a.mods.length), rep = A.filter(a => a.rep === 2);
  const per = a => { if (!a.mods.length) return 'o'; const y = +a.mods[a.mods.length - 1][0].slice(0, 4); return y < 1999 ? 'p1' : y < 2004 ? 'p2' : 'p3'; };
  const laws = new Map();
  c.arts.forEach(a => a.mods.forEach(m => { const k = m[1] + '|' + m[0]; if (!laws.has(k)) laws.set(k, { law: m[1], d: m[0], arts: [] }); laws.get(k).arts.push(a.p.match(/art-(\d+)/) ? +a.p.match(/art-(\d+)/)[1] : 'disp. ' + a.p.match(/allegato-([ivxl]+)/)[1].toUpperCase()); }));
  const LL = [...laws.values()].sort((a, b) => a.d.localeCompare(b.d));
  const big = LL.reduce((a, b) => a.arts.length >= b.arts.length ? a : b);
  const TN = { 1: ['Principi fondamentali', 'Fundamental principles'], 13: ['Parte I, titolo I · Rapporti civili', 'Part I, title I · Civil relations'], 29: ['Titolo II · Rapporti etico-sociali', 'Title II · Ethical and social relations'],
    35: ['Titolo III · Rapporti economici', 'Title III · Economic relations'], 48: ['Titolo IV · Rapporti politici', 'Title IV · Political relations'], 55: ['Parte II, titolo I · Il Parlamento', 'Part II, title I · Parliament'],
    83: ['Titolo II · Il Presidente della Repubblica', 'Title II · The President of the Republic'], 92: ['Titolo III · Il Governo', 'Title III · The Government'], 101: ['Titolo IV · La Magistratura', 'Title IV · The Judiciary'],
    114: ['Titolo V · Regioni, Province, Comuni', 'Title V · Regions, Provinces, Municipalities'], 134: ['Titolo VI · Garanzie costituzionali', 'Title VI · Constitutional guarantees'] };
  const starts = c.groups.map(g => g[1]).filter(s => TN[s]);
  return {
    title: L(`La Costituzione del 1948: ${fmt(orig.length)} dei ${fmt(A.length)} articoli conservano il testo originale`,
      `The 1948 Constitution: ${fmt(orig.length)} of its ${fmt(A.length)} articles keep their original text`),
    toc: L('La Costituzione articolo per articolo', 'The Constitution article by article'),
    dek: L(`Ogni casella è un articolo, nell’ordine delle parti e dei titoli; il colore dice quando è stato modificato l’ultima volta. La revisione più ampia è la ${lawShort(big.law)}, che ha riscritto il titolo V (regioni, province e comuni): ${fmt(big.arts.length)} articoli, ${fmt(rep.length)} dei quali abrogati. Gli articoli dei principi fondamentali e della prima parte sono cambiati di rado: il 9 e il 41 nel 2022 (ambiente), il 33 nel 2023 (sport).`,
      `Each square is an article, in the order of the parts and titles; the colour says when it was last amended. The broadest revision is ${lawShort(big.law)}, which rewrote title V (regions, provinces and municipalities): ${fmt(big.arts.length)} articles, ${fmt(rep.length)} of them repealed. The fundamental principles and the first part rarely changed: articles 9 and 41 in 2022 (environment), 33 in 2023 (sport).`),
    draw(el) {
      const cols = S8(), ramp = seqRamp();
      const CC = { o: css('--surface-2'), p1: ramp(0.45), p2: cols[1], p3: cols[6] };
      legend(el, [{ c: CC.o, l: L('testo del 1948', '1948 text'), shape: 'outline' }, { c: CC.p1, l: L('modificato l’ultima volta nel 1958–1993', 'last amended 1958–1993') }, { c: CC.p2, l: L('nel 1999–2003', 'in 1999–2003') }, { c: CC.p3, l: L('nel 2007–2023', 'in 2007–2023') }, { c: css('--muted-mark'), l: L('abrogato', 'repealed'), shape: 'hatch' }]);
      const w = W(el), nwd = narrow(w), sz = nwd ? 19 : 22, gap = 3, groups = starts.map((s, i) => ({ s, e: starts[i + 1] ? starts[i + 1] - 1 : 139 }));
      const lw = nwd ? 0 : Math.min(330, textW(el, groups.map(gr => L(...TN[gr.s]))) + 14), perRow = Math.max(4, Math.floor((w - lw) / (sz + gap)));
      let H = 0; const lay = groups.map(gr => { const n = gr.e - gr.s + 1, rows = Math.ceil(n / perRow), y0 = H + (nwd ? 16 : 0); H = y0 + rows * (sz + gap) + 8; return { ...gr, y0, rows }; });
      const svg = svgIn(el, w, H + 4), g = svg.append('g').attr('transform', `translate(${lw},2)`), hp = hatch(svg, css('--muted-mark'));
      lay.forEach(gr => {
        if (nwd) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', gr.y0 - 4).text(L(...TN[gr.s]));
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', gr.y0 + sz / 2 + 4).attr('text-anchor', 'end').text(L(...TN[gr.s]));
        A.filter(a => a.n >= gr.s && a.n <= gr.e).forEach((a, i) => {
          const xx = (i % perRow) * (sz + gap), yy = gr.y0 + Math.floor(i / perRow) * (sz + gap), k = per(a), fill = a.rep === 2 ? hp : CC[k];
          g.append('rect').attr('x', xx).attr('y', yy).attr('width', sz).attr('height', sz).attr('rx', 3).attr('fill', fill).attr('stroke', k === 'o' && a.rep !== 2 ? css('--line') : 'none');
          g.append('text').attr('x', xx + sz / 2).attr('y', yy + sz / 2 + 3.5).attr('text-anchor', 'middle').style('font', `${k === 'o' ? 400 : 600} ${a.n >= 100 ? 7.5 : 8.5}px var(--sans)`)
            .style('fill', k === 'o' || a.rep === 2 ? css('--text-3') : inkOn(CC[k])).style('pointer-events', 'none').text(a.n);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', xx).attr('y', yy).attr('width', sz).attr('height', sz).datum(a),
            d => `<b>${L('Articolo', 'Article')} ${d.n}</b>` + (d.mods.length ? d.mods.map(m => trow(null, lawShort(m[1]), dateTxt(m[0]))).join('') : trow(null, L('Testo', 'Text'), L('del 1948', 'of 1948'))) +
              (d.rep === 2 ? tq(L('abrogato', 'repealed')) : d.rep === 1 ? tq(L('in parte abrogato', 'partly repealed')) : ''));
        });
      });
      h4(el, L('Le leggi costituzionali che hanno modificato la Costituzione', 'The constitutional laws that amended the Constitution'), 12);
      const box = el.append('div').attr('class', 'amlist').style('display', 'grid').style('grid-template-columns', narrow(W(el)) ? '1fr' : 'repeat(2, minmax(0, 1fr))').style('column-gap', '28px');
      LL.forEach(l => { const r = box.append('div').attr('class', 'ar');
        r.append('b').text(l.d.slice(0, 4));
        r.append('span').text(lawShort(l.law));
        r.append('span').text(L('art. ', 'art. ') + l.arts.slice().sort((a, b) => (typeof a === 'number' ? a : 999) - (typeof b === 'number' ? b : 999)).join(', ')); });
      note(el, ['costituzione/art-<n>.md', 'costituzione/allegati/', 'git log --name-status -- costituzione'], fmt(A.length) + L(' articoli', ' articles') + ', ' + fmt(X.length) + L(' disposizioni transitorie', ' transitional provisions'),
        L(`un articolo modificato è un file che un commit di una legge costituzionale cambia dopo il testo del 1948 (in vigore dal 1º gennaio 1948); “abrogato” vuol dire che il testo vigente è solo la nota di abrogazione; l’errata corrige del 3 gennaio 1948 (art. 107) non conta come modifica. Le ${fmt(X.length)} disposizioni transitorie e finali, ${fmt(X.filter(x => x.mods.length).length)} delle quali modificate, sono nella tabella. La Costituzione nel repository arriva alla legge costituzionale 1/2023.`,
          `an amended article is a file that a commit of a constitutional law changes after the 1948 text (in force from 1 January 1948); "repealed" means the text in force is only the note of repeal; the corrigendum of 3 January 1948 (art. 107) does not count as an amendment. The ${fmt(X.length)} transitional and final provisions, ${fmt(X.filter(x => x.mods.length).length)} of them amended, are in the table. The Constitution in the repository runs to constitutional law 1/2023.`));
      table(el, [L('Disposizione', 'Provision'), L('Modifiche', 'Amendments'), L('Abrogata', 'Repealed')], [...A.map(a => [L('Art. ', 'Art. ') + a.n, a.mods.map(m => `${lawShort(m[1])} (${m[0]})`).join('; ') || '–', a.rep === 2 ? L('sì', 'yes') : a.rep === 1 ? L('in parte', 'in part') : '']),
        ...X.map(x => [L('Disp. trans. ', 'Trans. prov. ') + x.r, x.mods.map(m => `${lawShort(m[1])} (${m[0]})`).join('; ') || '–', x.rep === 2 ? L('sì', 'yes') : x.rep === 1 ? L('in parte', 'in part') : ''])]);
    }
  };
});
const lawShort = s => s.replace(/^Legge costituzionale (\d+)\/(\d+)$/, (a, n, y) => IT() ? `legge costituzionale ${n}/${y}` : `constitutional law ${n}/${y}`);

// 15. the four codes over time
const CODEN = { cc: ['Codice civile (1942)', 'Civil Code (1942)'], cp: ['Codice penale (1930)', 'Criminal Code (1930)'], cpc: ['Codice di procedura civile (1940)', 'Code of Civil Procedure (1940)'], cpp: ['Codice di procedura penale (1988)', 'Code of Criminal Procedure (1988)'] };
const CODES4 = ['cp', 'cpp', 'cc', 'cpc'];
chart('c15', el => {
  const c = D.c15, DEC = d3.range(1930, YEAR_LAST + 1, 10), v = (k, d) => (c.ver[k] || {})[d] || 0, tot = k => sum(DEC, d => v(k, d));
  const cp20 = v('cp', 2020), cp50 = v('cp', 1950), big = c.big, wide = !narrow(W(el));
  return {
    title: L(`I codici cambiano sempre più spesso: il Codice penale ha avuto ${fmt(cp20)} versioni dal 2020, ${fmt(cp50)} in tutti gli anni Cinquanta`,

// 16. the codes article by article
chart('c16', el => {
  const c = D.c16, cols = S8(), ramp = seqRamp();

  const KEYS = ['orig', 'm1', 'm3', 'add'], CC = () => ({ orig: css('--surface-2'), m1: ramp(0.45), m3: ramp(0.95), add: cols[1] });
  const KN = { orig: [L('testo originario, mai modificato', 'original text, never amended')], m1: [L('originario, modificato 1 o 2 volte', 'original, amended once or twice')], m3: [L('originario, modificato 3 volte o più', 'original, amended 3 times or more')], add: [L('aggiunto dopo (art. bis, ter…)', 'added later (art. bis, ter…)')] };
  const st = k => { const A = c[k].arts, o = A.filter(a => a[1]); return { n: A.length, orig: o.length, keep: o.filter(a => a[2] === 0).length, add: A.length - o.length }; };
  const s = Object.fromEntries(CODES4.map(k => [k, st(k)]));
  const yr = k => c[k].first.slice(0, 4);
  return {
    title: L(`Articolo per articolo: ${ilPct(s.cc.keep, s.cc.orig)} degli articoli originari del Codice civile non è mai stato modificato, del Codice penale ${ilPct(s.cp.keep, s.cp.orig).trim()}`,
      `Article by article: ${pct(s.cc.keep, s.cc.orig)} of the Civil Code's original articles have never been amended, of the Criminal Code's ${pct(s.cp.keep, s.cp.orig)}`),

    dek: L(`Ogni quadratino è un articolo in vigore oggi, nell’ordine del codice. Il colore dice se ha ancora il testo della prima versione in Normattiva, quante volte è stato modificato o se è stato aggiunto dopo. Il Codice penale ha ${fmt(s.cp.add)} articoli aggiunti su ${fmt(s.cp.n)}; il Codice di procedura penale, del 1988, conserva il testo originario in ${fmt(s.cpp.keep)} articoli su ${fmt(s.cpp.orig)}.`,
      `Each small square is an article in force today, in the code's order. The colour says whether it still has the text of the first version in Normattiva, how often it was amended, or whether it was added later. The Criminal Code has ${fmt(s.cp.add)} added articles of ${fmt(s.cp.n)}; the Code of Criminal Procedure, of 1988, keeps its original text in ${fmt(s.cpp.keep)} of ${fmt(s.cpp.orig)} articles.`),
    draw(el) {
      const cc = CC();

      const box = el.append('div').attr('class', 'mini').style('grid-template-columns', narrow(W(el)) ? '1fr' : 'repeat(2, minmax(0, 1fr))');
      const panes = CODES4.map(() => box.append('div'));
      CODES4.forEach((k, pi) => {
        const p = panes[pi], A = c[k].arts, S = s[k];
        p.append('h4').text(L(...CODEN[k]));
        p.append('p').text(L(`${fmt(S.n)} articoli · ${pct(S.keep, S.orig)} degli originari mai modificati`, `${fmt(S.n)} articles · ${pct(S.keep, S.orig)} of the original ones never amended`));
        const w = W(p), sz = A.length > 2000 ? 5 : 7, gap = 1, perRow = Math.floor(w / (sz + gap)), rows = Math.ceil(A.length / perRow);
        const svg = svgIn(p, w, rows * (sz + gap) + 2), g = svg.append('g');
        A.forEach((a, i) => g.append('rect').attr('x', (i % perRow) * (sz + gap)).attr('y', Math.floor(i / perRow) * (sz + gap)).attr('width', sz).attr('height', sz).attr('rx', 1.2).attr('fill', cc[cat(a)]).datum(a));
        bindTip(g.selectAll('rect'), a => `<b>${L('Art.', 'Art.')} ${esc(a[0].replace(/^0+/, '').replace(/-/g, '-'))}</b>` + trow(cc[cat(a)], KN[cat(a)][0], a[1] ? L(`${fmt(a[2])} modifiche`, `${fmt(a[2])} amendments`) : ''));

        fmt(sum(CODES4, k => s[k].n)) + L(' articoli', ' articles'),
        L(`un articolo è un file del codice; è originario se c’è già nella prima versione registrata (${CODES4.map(k => `${L(...CODEN[k]).split(' (')[0]}: ${dateTxt(c[k].first)}`).join('; ')}), e una modifica è un commit successivo che lo cambia. Un articolo abrogato resta come file con la nota di abrogazione e conta come modificato. Non sono contati gli articoli dei decreti che approvano i codici né, per il Codice civile, le disposizioni sulla legge in generale.`,
          `an article is a file of the code; it is original if it is already in the first recorded version (${CODES4.map(k => `${L(...CODEN[k]).split(' (')[0]}: ${dateTxt(c[k].first)}`).join('; ')}), and an amendment is a later commit that changes it. A repealed article stays as a file with the note of repeal and counts as amended. The articles of the decrees approving the codes are not counted, nor, for the Civil Code, the provisions on the law in general.`));
      table(el, [L('Codice', 'Code'), L('Articoli', 'Articles'), L('Originari', 'Original'), L('Mai modificati', 'Never amended'), L('Aggiunti', 'Added')], CODES4.map(k => [L(...CODEN[k]), s[k].n, s[k].orig, s[k].keep, s[k].add]));
    }
  };

part('p5', 'V. Le corti e l’Europa', 'V. The courts and Europe',

// 17. the Corte costituzionale

// 18. the kinds of proceedings before the Court
chart('c18', el => {
  const Y = D.c18.years, keys = ['inc', 'pri', 'enti', 'poteri', 'ref', 'other'], cols = S8();
  const colors = [cols[0], cols[1], cols[3], cols[6], cols[2], css('--muted-mark')];
  const names = [L('in via incidentale (da un giudice)', 'incidental (from a court)'), L('in via principale (Stato e Regioni)', 'direct action (State and Regions)'), L('conflitti tra Stato e Regioni', 'conflicts between State and Regions'),
    L('conflitti tra poteri dello Stato', 'conflicts between powers of the State'), L('ammissibilità dei referendum', 'admissibility of referendums'), L('altro (correzioni, accusa…)', 'other (corrections, impeachment…)')];
  const P = [['1956–1969', 1956, 1969], ['1970–1979', 1970, 1979], ['1980–1989', 1980, 1989], ['1990–2001', 1990, 2001], ['2002–2011', 2002, 2011], [`2012–${YEAR_LAST}`, 2012, YEAR_LAST]];
  const rows = P.map(([p, a, b]) => { const o = { p }; keys.forEach(k => o[k] = sum(d3.range(a, b + 1), y => (Y[y] || {})[k] || 0)); return o; });
  const tot = r => sum(keys, k => r[k]);
  return {
    title: L(`Stato contro Regioni: i giudizi in via principale passano ${prepPct('da', rows[3].pri, tot(rows[3]))} delle decisioni nel 1990–2001 ${prepPct('a', rows[5].pri, tot(rows[5]))} dal 2012`,
      `State against Regions: direct actions go from ${pct(rows[3].pri, tot(rows[3]))} of decisions in 1990–2001 to ${pct(rows[5].pri, tot(rows[5]))} since 2012`),
    toc: L('I giudizi della Corte', 'The Court\'s proceedings'),
    dek: L(`Ogni barra è un periodo: le decisioni della Corte per tipo di giudizio. Quasi tutte nascevano da un giudice che dubita di una legge mentre decide una causa (in via incidentale). Dopo la riforma del titolo V del 2001, che ha diviso la potestà legislativa fra Stato e Regioni, crescono i ricorsi diretti dello Stato contro leggi regionali e delle Regioni contro leggi statali.`,
      `Each bar is a period: the Court's decisions by kind of proceedings. Almost all used to come from a court that doubts a law while deciding a case (incidental review). After the 2001 reform of title V, which divided legislative power between the State and the Regions, direct actions grow: the State against regional laws and the Regions against state laws.`),
    draw(el) {
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      bands(el, rows, keys, colors, names, { label: r => r.p, right: r => fmt(tot(r)), rowH: 34, partial: r => r === rows[5] && false });
      note(el, ['giurisprudenza/corte-costituzionale/<anno>/<mese>/<tipo>-<n>/scheda.md (Giudizio)'], fmt(sum(rows, tot)) + L(' decisioni', ' decisions'),
        L(`il tipo di giudizio è quello della scheda di ciascuna decisione; i conflitti tra poteri comprendono le decisioni sulla loro ammissibilità; “altro” raccoglie le correzioni di errori materiali, i giudizi di accusa, le sospensioni e le decisioni su più giudizi insieme. Il ${YEAR_LAST} è incompleto.`,
          `the kind of proceedings is the one in each decision's record; conflicts between powers include the decisions on their admissibility; "other" groups corrections of clerical errors, impeachment trials, suspensions and decisions on several proceedings at once. ${YEAR_LAST} is partial.`));
      table(el, [L('Periodo', 'Period'), ...names, t('total')], rows.map(r => [r.p, ...keys.map(k => r[k]), tot(r)]));
    }
  };
});

// 19. the administrative courts

  const mon = c.mon, avgOther = sum(['01', '02', '03', '04', '05', '06', '07', '09', '10', '11', '12'], k => mon[k] || 0) / 11;

    toc: L('Giustizia amministrativa', 'Administrative courts'),
    dek: L(`Il numero di ricorso (NRG) comincia con l’anno del deposito: confrontato con l’anno della sentenza, dice quanto ha atteso la decisione. Sulla mappa, per regione, la quota di sentenze 2017–2025 che decidono ricorsi di cinque o più anni prima; ${wide ? 'a destra' : 'sotto'} ogni sede, dalla più lenta. In agosto, mese di sospensione feriale dei termini, si pubblicano ${ilPct(mon['08'] || 0, avgOther)} delle sentenze di un mese medio.`,
      `The appeal number (NRG) begins with the year it was filed: compared with the year of the judgment, it says how long the decision took. On the map, by region, the share of 2017–2025 judgments deciding appeals filed five or more years earlier; ${wide ? 'on the right' : 'below'} every seat, slowest first. In August, the month when procedural time limits are suspended, ${pct(mon['08'] || 0, avgOther)} of an average month's judgments are published.`),
    draw(el) {
      const vals = Object.fromEntries(Object.entries(regs).map(([k, r]) => [k, r.o / r.n])), mx = d3.max(Object.values(vals));
      const col = v => v == null ? css('--surface-2') : ramp(0.12 + 0.88 * (v / mx));
      const w = W(el), nwd = narrow(w), box = el.append('div').attr('class', 'twocol'), left = box.append('div'), right = box.append('div');
      const cs = Math.min(nwd ? 54 : 62, (W(left) - 4) / 6), s = cs - 3;
      const svg = svgIn(left, cs * 6 + 2, cs * 7 + 2), g = svg.append('g').attr('transform', 'translate(1,1)');
      Object.entries(REG).forEach(([k, [nm, ab, [cx, cy]]]) => {
        const v = vals[k], fill = col(v), ink = inkOn(fill), x0 = cx * cs, y0 = cy * cs;
        g.append('rect').attr('x', x0).attr('y', y0).attr('width', s).attr('height', s).attr('rx', 8).attr('fill', fill);
        g.append('text').attr('class', 'lbl').attr('x', x0 + s / 2).attr('y', y0 + s / 2 - 3).attr('text-anchor', 'middle').style('fill', ink).style('font-size', '10px').style('pointer-events', 'none').text(ab);
        g.append('text').attr('class', 'lbl strong').attr('x', x0 + s / 2).attr('y', y0 + s / 2 + 11).attr('text-anchor', 'middle').style('fill', ink).style('pointer-events', 'none').text(v == null ? '–' : s >= 56 ? pv(100 * v, v < .1 ? 1 : 0) : pv(100 * v, v < .1 ? 1 : 0).replace(' ', ''));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x0).attr('y', y0).attr('width', s).attr('height', s).datum(k),
          kk => `<b>${REG[kk][0]}</b>` + (regs[kk] ? trow(null, L('Sentenze 2017–2025', 'Judgments 2017–2025'), fmt(regs[kk].n)) + trow(null, L('Ricorsi di 5 o più anni prima', 'Appeals of 5 or more years before'), pct(regs[kk].o, regs[kk].n, 1)) + regs[kk].seats.map(q => tq(sn(q))).join('') : ''));
      });
      const rows = [...tars, ...seats.filter(q => !/^TAR/.test(q) && /GIURISDIZIONALE/.test(q))].map(q => ({ q, ...c.age[q] }));
      legend(right, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      bands(right, rows, keys, colors, names, { label: r => narrow(W(el)) ? sn(r.q).replace(/^TAR [^,]+, /, 'TAR ') : sn(r.q), right: r => pct((r.a5 || 0) + (r.a10 || 0), tot(r.q)), rowH: 21, minIn: 999 });
      note(el, ['giurisprudenza/giustizia-amministrativa/<sede>/<anno>/<mese>/<giorno>/', 'git log (Appeal:, In-force:)'], fmt(sum(rows, r => tot(r.q))) + L(' sentenze', ' judgments'),
        L(`sono contate le sentenze e le sentenze brevi pubblicate dal 2017 al 2025 (OpenGA); l’anno del ricorso sono le prime quattro cifre del numero di registro generale. Per il Consiglio di Stato e il CGA siciliano, giudici d’appello, il numero è quello dell’appello. Le sedi con meno di 300 sentenze sono escluse; la mappa somma le sedi di una regione. In tutto il repository conta ${fmt(sum(Object.values(c.n)))} provvedimenti di ${Object.keys(c.n).length} sedi, 2017–${YEAR_LAST}.`,
          `counted are the judgments and short-form judgments published from 2017 to 2025 (OpenGA); the appeal's year is the first four digits of its general register number. For the Council of State and the Sicilian CGA, appeal courts, the number is that of the appeal. Seats with fewer than 300 judgments are left out; the map adds up the seats of a region. In all the repository holds ${fmt(sum(Object.values(c.n)))} decisions of ${Object.keys(c.n).length} seats, 2017–${YEAR_LAST}.`));
      table(el, [L('Sede', 'Seat'), ...names, t('total')], rows.map(r => [sn(r.q), ...keys.map(k => r[k] || 0), tot(r.q)]));
    }
  };
});

// 20. EU directives
chart('c20', el => {
  const Y = D.c20.years, keys = ['dlgs', 'legge', 'dl', 'dpr', 'dm', 'dpcm', 'adm', 'other', 'none'], cols = S8();
  const colors = [cols[0], cols[1], cols[7], cols[3], cols[2], cols[4], cols[6], css('--muted-mark'), css('--line')];
  const names = [L('decreti legislativi', 'legislative decrees'), L('leggi (anche comunitarie ed europee)', 'laws (incl. annual EU laws)'), L('decreti-legge', 'decree-laws'), L('D.P.R.', 'presidential decrees'),
    L('decreti ministeriali e altri decreti', 'ministerial and other decrees'), L('D.P.C.M.', 'prime-ministerial decrees'), L('misure amministrative', 'administrative measures'), L('altro', 'other'), L('misura non necessaria', 'no measure needed')];
  const P = [['1958–1979', 1958, 1979], ['1980–1989', 1980, 1989], ['1990–1999', 1990, 1999], ['2000–2009', 2000, 2009], ['2010–2019', 2010, 2019], [`2020–${YEAR_LAST}`, 2020, YEAR_LAST]];
  const rows = P.map(([p, a, b]) => { const o = { p, a, b }; keys.forEach(k => o[k] = sum(d3.range(a, b + 1), y => (Y[y] || {})[k] || 0)); return o; });
  const tot = r => sum(keys, k => r[k]), since = rows.filter(r => r.a >= 2000), dl0 = sum(since, r => r.dlgs), n0 = sum(since, tot), early = rows.filter(r => r.b <= 1989), dlE = sum(early, r => r.dlgs), nE = sum(early, tot);
  const lag = D.c20.lag, medP = (a, b) => d3.median(d3.range(a, b + 1).flatMap(y => lag[y] ? [lag[y][1]] : []).filter(v => v != null));
  return {
    title: L(`Le direttive europee: i decreti legislativi sono ${ilPct(dl0, n0)} delle misure di recepimento notificate dal 2000, ${ilPct(dlE, nE, 1).trim()} fino al 1989`,
      `EU directives: legislative decrees are ${pct(dl0, n0)} of the transposition measures notified since 2000, ${pct(dlE, nE, 1)} up to 1989`),
    toc: L('Le direttive europee', 'EU directives'),
    dek: L(`Per ogni direttiva, lo Stato comunica alla Commissione europea le misure con cui la recepisce. Ogni barra è un periodo di notifica: le misure italiane per tipo di atto. Le direttive si recepiscono sempre più con decreti legislativi del Governo, su delega della legge comunitaria (dal 2014 legge di delegazione europea), e sempre meno con decreti ministeriali. A destra, la mediana degli anni tra la direttiva e la notifica.`,
      `For every directive, the State notifies the European Commission of the measures transposing it. Each bar is a period of notification: the Italian measures by kind of act. Directives are transposed more and more by legislative decrees of the Government, delegated by the annual EU law (since 2014 the European delegation law), and less and less by ministerial decrees. On the right, the median years between the directive and the notification.`),
    draw(el) {
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      bands(el, rows, keys, colors, names, { label: r => r.p, right: r => `${fmt(tot(r))} · ${dec(medP(r.a, r.b), 0)} ${yrsW(Math.round(medP(r.a, r.b)))}`, rowH: 34 });
      note(el, ['eu-nim/<anno>/<mese>/<id>.json', 'git log (Act-type:, Transposes:, In-force:)'], fmt(D.c20.n) + L(' misure notificate', ' notified measures'),
        L(`il tipo d’atto si legge dal titolo della misura (“Decreto legislativo del…”, “Decreto ministeriale del…”), altrimenti dal campo Act-type della Commissione; l’anno è quello della notifica. Gli anni dalla direttiva vengono dal numero CELEX della direttiva recepita. Sono metadati della Commissione, senza il testo; una direttiva può avere più misure.`,
          `the kind of act is read from the measure's title ("Decreto legislativo del…", "Decreto ministeriale del…"), otherwise from the Commission's Act-type field; the year is that of notification. The years since the directive come from the CELEX number of the directive transposed. These are the Commission's metadata, without the text; a directive may have several measures.`));
      table(el, [L('Periodo', 'Period'), ...names, t('total'), L('Anni dalla direttiva (mediana)', 'Years since the directive (median)')], rows.map(r => [r.p, ...keys.map(k => r[k]), tot(r), dec(medP(r.a, r.b), 0)]));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'p2', 'c05', 'c06', 'c07', 'c08', 'p3', 'c09', 'c10', 'c11', 'c12', 'c13', 'p4', 'c14', 'c15', 'c16', 'p5', 'c17', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
const TILES = () => [[fmt(PF.acts), L('atti statali in vigore', 'state acts in force')], [fmt(PF.laws), L('leggi dal 1946', 'laws since 1946')],
  [fmt(PF.camera_bills), L('progetti di legge della Camera', 'Camera bills')], [fmt(PF.camera_votes), L('votazioni della Camera dal 1996', 'Camera votes since 1996')],
  [fmt(PF.cc), L('decisioni della Corte costituzionale', 'Constitutional Court decisions')], [fmt(PF.ga), L('provvedimenti della giustizia amministrativa', 'administrative court decisions')]];
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Norme in vigore', 'Acts in force'), 'normativa/<tipo>/<anno>/<numero>/', fmt(P.acts), L('il testo vigente di Normattiva, atti dal 1861 al 2026; tutte le versioni per la Costituzione, le leggi costituzionali, i quattro codici e quattro leggi', 'Normattiva\'s text in force, acts from 1861 to 2026; every version of the Constitution, the constitutional laws, the four codes and four statutes'),
      L('solo ciò che è in vigore: gli atti abrogati non ci sono; le date delle versioni dei codici sono il primo giorno in cui Normattiva mostra il nuovo testo', 'only what is in force: repealed acts are not here; the dates of the codes\' versions are the first day Normattiva shows the new text')],
    [L('Intestazioni degli atti', 'Act headings'), 'normativa/**/intestazione.md', fmt(P.acts), L('tipo, data, numero e titolo; per molti atti dal 1988 il giorno di entrata in vigore', 'kind, date, number and title; for many acts since 1988 the day of entry into force'), L('letti come testo, senza correzioni', 'read as text, uncorrected')],
    [L('Storia git', 'Git history'), 'git log', fmt(P.commits), L('un commit per atto, versione, scheda o decisione, datato al giorno indicato nel trailer In-force (il 1º gennaio 1970 per i giorni precedenti)', 'one commit per act, version, record or decision, dated the day in its In-force trailer (1 January 1970 for earlier days)'), L('i trailer Enacted e Published danno firma e Gazzetta', 'the Enacted and Published trailers give signature and Gazzetta')],
    [L('Leggi', 'Laws'), 'parlamento/schede/leggi/', fmt(P.laws), `${P.laws_from.slice(0, 4)}–${P.laws_to.slice(0, 4)}`, L('dati della Camera: titolo, data, Gazzetta; non l’entrata in vigore', 'the Camera\'s data: title, date, Gazzetta; not the entry into force')],
    [L('Progetti di legge della Camera', 'Camera bills'), 'parlamento/schede/camera/', fmt(P.camera_bills), L('dal Regno (in parte) alla XIX legislatura', 'from the Kingdom (in part) to the XIX legislature'), L('titolo e data di presentazione; l’esito non è nella scheda', 'title and date of presentation; the outcome is not in the record')],
    [L('Disegni di legge (Senato)', 'Bills (Senate)'), 'parlamento/schede/senato/', fmt(P.senate_phases) + L(' fasi', ' phases'), `1996–${P.senate_to.slice(0, 4)}`, L(`i dati si fermano ${pD('al', P.senate_to)}; l’iniziativa è indicata solo dalla XV legislatura`, `the data stop on ${dateTxt(P.senate_to)}; the initiative is given only from the XV legislature`)],
    [L('Votazioni della Camera', 'Camera votes'), 'parlamento/atti-parlamentari/camera/votazioni/', fmt(P.camera_votes), '1996–' + YEAR_LAST, L('la richiesta di fiducia non è indicata nella XIII legislatura', 'the request for confidence is not given in the XIII legislature')],
    [L('Corte costituzionale', 'Constitutional Court'), 'giurisprudenza/corte-costituzionale/', fmt(P.cc), '1956–' + YEAR_LAST, L('schede, testi e massime', 'records, texts and headnotes')],
    [L('Giustizia amministrativa', 'Administrative courts'), 'giurisprudenza/giustizia-amministrativa/', fmt(P.ga), '2017–' + YEAR_LAST, L('metadati OpenGA, senza il testo dei provvedimenti', 'OpenGA metadata, without the decisions\' text')],
    [L('Recepimento delle direttive', 'Transposition of directives'), 'eu-nim/', fmt(P.nim), '1958–' + YEAR_LAST, L('metadati della Commissione europea, senza testo', 'the European Commission\'s metadata, without text')],
    [L('Non usati', 'Not used'), 'giurisprudenza/corte-dei-conti/ · autorita/agcm/ · parlamento/lavori-parlamentari/', '–', L('Corte dei conti, Autorità garante della concorrenza, documenti e votazioni del Senato, interventi e atti di indirizzo della Camera', 'Court of Audit, competition authority, Senate documents and votes, Camera speeches and motions'),
      L('anni sparsi (Corte dei conti) o una sola data di pubblicazione dei dati (AGCM)', 'scattered years (Court of Audit) or a single data release date (AGCM)')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}

// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  d3.select('#tiles').html('').selectAll('div').data(TILES()).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${esc(d[1])}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.it, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dit, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.it, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('it-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('it-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
</body>
