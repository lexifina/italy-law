<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il diritto italiano in 20 grafici</title>
<meta name="description" content="Venti grafici sul diritto italiano dal repository italy-law / Twenty charts on Italian law from the italy-law repository">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.25 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.35 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, currentColor 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid; border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.lbl.big { font-size: 12px; }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; min-height: 2.8em; display: flex; align-items: flex-end; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.amlist { font-size: 12px; line-height: 1.45; }
.amlist .ar { display: grid; grid-template-columns: 40px max-content minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.amlist .ar b { font-weight: 600; font-variant-numeric: tabular-nums; }
.amlist .ar span:nth-child(2) { color: var(--text); }
.amlist .ar span:last-child { color: var(--text-2); text-align: right; }
.amlist .ar i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 760px) { .twocol { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Lingua / Language"><button data-lang="it">IT</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Tema / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
let LANG = 'it';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'it') LANG = q; else { const s = localStorage.getItem('it-viz-lang'); if (s === 'en' || s === 'it') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('it-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

const t = k => S[LANG][k];
const IT = () => LANG === 'it';
const L = (it, en) => IT() ? it : en;
const grp = (s, sep) => s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
const fmt = n => { if (n == null || isNaN(n)) return '–'; const v = Math.round(+n); return (v < 0 ? '−' : '') + grp(String(Math.abs(v)), IT() ? '.' : ','); };
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d), [i, f] = s.split('.'); return (+v < 0 ? '−' : '') + grp(i, IT() ? '.' : ',') + (f ? (IT() ? ',' : '.') + f : ''); };
const PS = () => IT() ? ' %' : '%';
const pct = (a, b, d = 0) => b ? dec(100 * a / b, d) + PS() : '–';
const pv = (v, d = 0) => dec(v, d) + PS();
const yearTxt = v => v == null || v === '' ? '–' : String(v);   // years print plain (2015), never grouped like counts
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MSH = { it: ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const DOW = { it: ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'], en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] };
const DOWS = { it: ['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'], en: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] };
const dayIt = d => d === 1 ? '1º' : String(d);
const dateTxt = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return IT() ? `${dayIt(d)} ${MESI[m - 1]} ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const pD = (p, s) => { const d = s ? +String(s).slice(8, 10) : 0; return d === 8 || d === 11 ? (p === 'il' ? 'l’' : p + 'l’') + dateTxt(s) : `${p} ${dateTxt(s)}`; };
const dateShort = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return IT() ? `${dayIt(d)} ${MSH.it[m - 1]} ${y}` : `${d} ${MSH.en[m - 1]} ${y}`; };
const dayMonth = (m, d) => IT() ? `${dayIt(d)} ${MESI[m - 1]}` : `${d} ${MEN[m - 1]}`;
const monthTxt = s => { const [y, m] = s.split('-').map(Number); return IT() ? `${MESI[m - 1]} ${y}` : `${MEN[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const ROM = n => { const v = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [k, r] of v) while (n >= k) { s += r; n -= k; } return s; };
const andList = arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + L(' e ', ' and ') + arr[arr.length - 1] : (arr[0] || '');

// ------------------------------------------------------------------ strings
const S = {
it: {
  title: 'Il diritto italiano in 20 grafici',
  lede: 'Venti grafici tratti soltanto dai dati di questo repository: gli atti statali vigenti pubblicati su Normattiva, con la storia di ogni versione della Costituzione e dei quattro codici; le leggi, i progetti di legge e le votazioni di Camera e Senato; le pronunce della Corte costituzionale e della giustizia amministrativa; e le misure con cui l’Italia recepisce le direttive dell’Unione europea.',
  profile_h: 'Profilo dei dati: che cosa è stato usato e quanto è completo',
  tbl: 'Tabella dei dati', src: 'Fonte nel repository', n: 'Record', cover: 'Copertura', caveat: 'Limiti', ds: 'Insieme di dati',
  foot: 'Realizzato a partire dal repository lexifina/italy-law ({built}). I numeri sono calcolati dallo script visualisations/src/prep.py a partire dalla storia git, dagli alberi del repository e dalle schede di Camera, Senato e Corte costituzionale; la pagina è composta da build.py. Tutti i grafici sono descrittivi: mostrano ciò che le fonti registrano, non il perché.',
  year: 'Anno', total: 'Totale', share: 'Quota', partial: 'anno incompleto', count: 'Numero', leg: 'Legislatura',
  gl: 'Grafici sul diritto di tutti i Paesi, dall’intero global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Qui ci sono soltanto i grafici sull’Italia.',
},
en: {
  title: 'Italian law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the state acts in force as Normattiva publishes them, with the history of every version of the Constitution and of the four codes; the laws, bills and votes of the Camera and the Senate; the decisions of the Constitutional Court and the administrative courts; and the measures by which Italy transposes the directives of the European Union.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit', ds: 'Dataset',
  foot: 'Built from the lexifina/italy-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history, the repository\'s trees and the records of the Camera, the Senate and the Constitutional Court; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  year: 'Year', total: 'Total', share: 'Share', partial: 'partial year', count: 'Count', leg: 'Legislature',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Italy alone.',
}};

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;
const tq = s => `<div class="q">${esc(s)}</div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c).style('color', it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
  return d;
}
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(s)}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + esc(extra) : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));

  lgt: ['Decreti luogotenenziali (1944–1946)', 'Lieutenancy decrees (1944–1946)'], altri: ['Decreti ministeriali, D.P.C.M. e altri', 'Ministerial and prime-ministerial decrees, other'] };
const GKS = { dpr: ['D.P.R.', 'D.P.R.'], legge: ['Leggi', 'Laws'], dl: ['Decreti-legge', 'Decree-laws'], dlgs: ['Decreti legislativi', 'Legislative decrees'], regi: ['Regi decreti', 'Royal decrees'],
  lgt: ['Decreti luogotenenziali', 'Lieutenancy decrees'], altri: ['Altri decreti', 'Other decrees'] };
const GKC = () => { const c = S8(); return [c[0], c[1], c[7], c[6], c[3], c[4], css('--muted-mark')]; };
const TOPIC = {
  eccl: ['Enti ecclesiastici riconosciuti agli effetti civili', 'Church bodies recognised for civil purposes'],
  enti: ['Enti morali e persone giuridiche: erezione e riconoscimento', 'Charities and other legal persons: establishment and recognition'],
  statuti: ['Statuti di enti, fondazioni e università', 'Statutes of bodies, foundations and universities'],
  autor: ['Autorizzazioni a enti: lasciti, acquisti, vendite', 'Authorisations to bodies: bequests, purchases, sales'],
  fond: ['Riforma fondiaria: terreni trasferiti agli enti', 'Land reform: land transferred to the reform bodies'],
  enel: ["Trasferimenti di imprese all'ENEL", 'Transfers of companies to ENEL'],
  osp: ['Enti ospedalieri', 'Hospital bodies'],
  scuole: ['Scuole e università: istituti, cattedre, posti', 'Schools and universities: institutes, chairs, posts'],
  comuni: ['Comuni: unioni, distacchi, nomi', 'Municipalities: mergers, splits, names'],
  trattati: ['Trattati e accordi internazionali', 'Treaties and international agreements'],
  conv: ['Conversioni in legge di decreti-legge', 'Conversions of decree-laws into law'],
  ue: ['Attuazione di direttive europee', 'Transposition of EU directives'],
  reg: ['Regolamenti', 'Regulations'],
  altro: ['Altre leggi, decreti e provvedimenti', 'Other laws, decrees and measures'] };
const SINGLE = ['eccl', 'enti', 'statuti', 'autor', 'osp'];
// the twenty regions as tiles, roughly where they lie: [column, row]
const REG = {
  vda: ["Valle d'Aosta", 'VdA', [0, 0]], pie: ['Piemonte', 'PIE', [0, 1]], lig: ['Liguria', 'LIG', [0, 2]], lom: ['Lombardia', 'LOM', [1, 0]],
  taa: ['Trentino-Alto Adige', 'TAA', [2, 0]], ven: ['Veneto', 'VEN', [2, 1]], fvg: ['Friuli Venezia Giulia', 'FVG', [3, 0]], emr: ['Emilia-Romagna', 'EMR', [1, 1]],
  tos: ['Toscana', 'TOS', [1, 2]], umb: ['Umbria', 'UMB', [2, 2]], mar: ['Marche', 'MAR', [3, 2]], laz: ['Lazio', 'LAZ', [2, 3]], abr: ['Abruzzo', 'ABR', [3, 3]],
  mol: ['Molise', 'MOL', [4, 3]], cam: ['Campania', 'CAM', [3, 4]], bas: ['Basilicata', 'BAS', [4, 4]], pug: ['Puglia', 'PUG', [5, 4]], cal: ['Calabria', 'CAL', [4, 5]],
  sic: ['Sicilia', 'SIC', [3, 6]], sar: ['Sardegna', 'SAR', [0, 4]] };
const SEATREG = s => { const t = s.toUpperCase(); for (const [k, re] of [['vda', /VALLE D'AOSTA/], ['pie', /PIEMONTE/], ['lig', /LIGURIA/], ['lom', /LOMBARDIA/], ['taa', /TRENTINO/], ['ven', /VENETO/], ['fvg', /FRIULI/],
  ['emr', /EMILIA/], ['tos', /TOSCANA/], ['umb', /UMBRIA/], ['mar', /MARCHE/], ['laz', /LAZIO/], ['abr', /ABRUZZO/], ['mol', /MOLISE/], ['cam', /CAMPANIA/], ['bas', /BASILICATA/], ['pug', /PUGLIA/],
  ['cal', /CALABRIA/], ['sic', /SICILIA/], ['sar', /SARDEGNA/]]) if (re.test(t)) return k; return null; };
// a seat as people write it: "TAR Lazio, Roma", "Consiglio di Stato"
const seatName = s => {
  if (/^CdS GIURISDIZIONALE/.test(s)) return L('Consiglio di Stato', 'Council of State');
  if (/^CdS CONSULTIVE/.test(s)) return L('Consiglio di Stato (pareri)', 'Council of State (opinions)');
  if (/^CGA GIURISDIZIONALE/.test(s)) return L('CGA Regione siciliana', 'CGA, Sicilian Region');
  if (/^CGA CONSULTIVE/.test(s)) return L('CGA Regione siciliana (pareri)', 'CGA, Sicilian Region (opinions)');
  const m = s.match(/^TAR (.*?) - (.*)$/);
  if (!m) return s;
  const tc = x => x.toLowerCase().replace(/(^|[\s'-])([a-zà-ù])/g, (a, b, c) => b + c.toUpperCase()).replace(/ D'aosta/, " d'Aosta").replace(/D'aosta/, "d'Aosta").replace(/Venezia Giulia/, 'Venezia Giulia');
  const reg = tc(m[1]), city = tc(m[2]);
  return reg.split(/[ -]/)[0] === city || /Trentino/.test(reg) ? `TAR ${city}` : `TAR ${reg.replace('Emilia-romagna', 'Emilia-Romagna')}, ${city}`;
};

// ------------------------------------------------------------------ the charts
const CH = [];
const part = (id, it, en, dit, den) => CH.push({ part: true, id, it, en, dit, den });
const chart = (id, fn) => CH.push({ id, fn });

part('p1', 'I. Le norme in vigore', 'I. The law in force',
  'Il repository tiene il testo vigente degli atti statali pubblicati da Normattiva, dal Regno d’Italia a oggi: leggi, decreti e regolamenti, ciascuno nella cartella del suo tipo, del suo anno e del suo numero, con la data della firma e quella della Gazzetta Ufficiale. Questi grafici contano ciò che è in vigore oggi: gli atti abrogati non ci sono.',
  'The repository holds the text in force of the state acts Normattiva publishes, from the Kingdom of Italy to today: laws, decrees and regulations, each in the folder of its kind, year and number, with the date it was signed and the date of the Gazzetta Ufficiale. These charts count what is in force today: repealed acts are not here.');

// 1. what is in force, by year and kind
chart('c01', el => {
  const c = D.c01, colors = GKC(), tot = r => sum(GK, k => r[k] || 0);
  const rows = [{ y: 1860 }, ...c.rows.filter(r => r.y >= 1861)];
  const all = sum(rows, tot), peak = rows.reduce((a, b) => tot(a) >= tot(b) ? a : b), dprN = c.kinds.dpr || 0, old = c.oldest[0];
  return {
    title: L(`Che cosa è in vigore: ${ilPct(c.pre1970, all)} dei ${fmt(all)} atti statali vigenti è anteriore al 1970`,
      `What is in force: ${pct(c.pre1970, all)} of the ${fmt(all)} state acts in force date from before 1970`),
    toc: L('Che cosa è in vigore', 'What is in force'),
    dek: L(`Ogni colonna è un anno: quanti atti firmati quell’anno sono oggi in vigore, per tipo. ${fmt(c.pre1946)} risalgono al Regno d’Italia; il più antico è un regio decreto ${pD('del', old[1])} che autorizza la vendita di 150 metri quadrati di terreno accanto al cimitero di Monza. L’anno con più atti vigenti è il ${peak.y} (${fmt(tot(peak))}, di cui ${fmt(peak.dpr)} decreti del Presidente della Repubblica); in tutto i D.P.R. sono ${ilPct(dprN, all)} degli atti vigenti.`,
      `Each column is one year: how many acts signed that year are in force today, by kind. ${fmt(c.pre1946)} date from the Kingdom of Italy; the oldest is a royal decree of ${dateTxt(old[1])} authorising the sale of 150 square metres of land next to the cemetery of Monza. The year with the most acts in force is ${peak.y} (${fmt(tot(peak))}, ${fmt(peak.dpr)} of them presidential decrees); presidential decrees make up ${pct(dprN, all)} of all acts in force.`),
    draw(el) {
      legend(el, GK.map((k, i) => ({ c: colors[i], l: L(...GKN[k]) })));
      const nw = narrow(W(el));
      const s = stackedColumns(el, rows, GK, colors, GK.map(k => L(...GKN[k])), { partial: r => r.y === YEAR_LAST, pad: 0.12, mt: 40, h: 320, labelIf: r => r.y % (nw ? 40 : 10) === 0, xf: y => String(y),
        tip: r => `<b>${r.y}${r.y === YEAR_LAST ? ' (' + t('partial') + ')' : ''}</b>` + GK.map((k, i) => r[k] ? trow(colors[i], L(...GKS[k]), fmt(r[k])) : '').reverse().join('') + trow(null, t('total'), fmt(tot(r))) });
      const bx = y => s.x(y) + s.x.bandwidth() / 2;
      [[L('Regno d’Italia', 'Kingdom of Italy'), 1861, 1945], [L('Repubblica', 'Republic'), 1946, YEAR_LAST]].forEach(([lab, a, b], i) => {
        const x0 = s.x(a), x1 = s.x(b) + s.x.bandwidth();
        s.g.insert('rect', ':first-child').attr('x', x0).attr('width', x1 - x0).attr('y', -34).attr('height', s.ih + 34).attr('rx', 6).attr('fill', css('--surface-2')).attr('opacity', i ? 0 : .8);
        s.g.append('text').attr('class', 'lbl mut').attr('x', x0 + 6).attr('y', -22).text(lab);
      });
      const px = bx(peak.y), py = s.y(tot(peak)), lab = L(`${peak.y}: ${fmt(tot(peak))} atti`, `${peak.y}: ${fmt(tot(peak))} acts`);
      const right = px + 10 + textW(el, [lab]) < s.iw;
      s.g.append('line').attr('x1', px).attr('x2', right ? px + 8 : px - 8).attr('y1', py - 2).attr('y2', py - 2).attr('stroke', css('--text-2'));
      halo(s.g, right ? px + 11 : px - 11, py + 2, lab, right ? 'start' : 'end');
      note(el, ['normativa/<tipo>/<anno>/<numero>/', 'git log (Enacted:)'], fmt(all) + L(' atti', ' acts'),
        L(`l’anno è quello della cartella dell’atto, cioè della sua firma; i regi decreti comprendono anche i regi decreti legislativi e il regio decreto-legge in vigore, i decreti luogotenenziali sono del 1944–1946. Il ${YEAR_LAST} è incompleto (più chiaro). Gli atti abrogati, e quelli che Normattiva non pubblica, non sono contati.`,
          `the year is that of the act's folder, the year it was signed; royal decrees include royal legislative decrees and the one royal decree-law in force, lieutenancy decrees date from 1944–1946. ${YEAR_LAST} is partial (lighter). Repealed acts, and acts Normattiva does not publish, are not counted.`));
      table(el, [t('year'), ...GK.map(k => L(...GKS[k])), t('total')], rows.filter(r => tot(r)).map(r => [String(r.y), ...GK.map(k => r[k] || 0), tot(r)]));
    }
  };
});

// 2. what the acts in force do
chart('c02', el => {
  const c = D.c02, all = sum(Object.values(c.n)), keys = Object.keys(c.n).filter(k => k !== 'altro').sort((a, b) => c.n[b] - c.n[a]).concat(['altro']);
  const single = sum(SINGLE, k => c.n[k] || 0), DEC = d3.range(1860, YEAR_LAST + 1, 10), wide = !narrow(W(el));
  const fond50 = (c.dec.fond || {})['1950'] || 0;
  return {
    title: L(`Che cosa resta in vigore: ${ilPct(single, all)} degli atti riguarda un singolo ente, dalla parrocchia alla fondazione`,
      `What remains in force: ${pct(single, all)} of the acts concern a single body, from a parish to a foundation`),
    toc: L('Che cosa resta in vigore', 'What remains in force'),
    dek: L(`Il titolo di ogni atto vigente, letto dalla sua intestazione, dice che cosa fa. ${fmt(c.n.eccl)} riconoscono agli effetti civili un ente ecclesiastico (una parrocchia, una chiesa, una confraternita); ${fmt(c.n.enti)} erigono in ente morale un’opera o un’associazione o ne riconoscono la personalità giuridica; ${fmt(c.n.statuti)} ne approvano o modificano lo statuto. ${fmt(c.n.fond)} trasferiscono terreni della riforma fondiaria, ${fmt(fond50)} dei quali firmati negli anni Cinquanta.${wide ? ' A destra, gli stessi atti per decennio.' : ''}`,
      `The title of every act in force, read from its heading, says what it does. ${fmt(c.n.eccl)} recognise a church body for civil purposes (a parish, a church, a confraternity); ${fmt(c.n.enti)} establish a charity or association as a legal person or recognise it as one; ${fmt(c.n.statuti)} approve or amend its statute. ${fmt(c.n.fond)} transfer land under the land reform, ${fmt(fond50)} of them signed in the 1950s.${wide ? ' On the right, the same acts by decade.' : ''}`),
    draw(el) {
      const w = W(el), nwd = narrow(w), cols = S8(), labs = keys.map(k => L(...TOPIC[k]));
      legend(el, [{ c: cols[0], l: L('atti su un singolo ente', 'acts about a single body') }, { c: cols[3], l: L('altri gruppi riconosciuti dal titolo', 'other groups recognised from the title') }, { c: css('--muted-mark'), l: L('nessuna delle formule', 'none of the formulas') }]
        .concat(nwd ? [] : [{ c: seqRamp()(0.7), l: L('a destra: atti per decennio della firma', 'on the right: acts by decade of signature') }]));
      const lw = nwd ? 0 : Math.min(330, textW(el, labs) + 14), rowH = nwd ? 32 : 24, cw = nwd ? 0 : Math.max(14, Math.min(24, (w - lw - 210) / DEC.length));
      const m = { t: 22, r: 6, b: 4, l: lw }, barW = nwd ? w - 8 : w - lw - cw * DEC.length - 22;
      const h = m.t + m.b + keys.length * rowH, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const labW = textW(el, keys.map(k => `${fmt(c.n[k])} · ${pct(c.n[k], all)}`), 'lbl') + 10;
      const x = d3.scaleLinear().domain([0, d3.max(keys, k => c.n[k])]).range([0, barW - labW]), hx = barW + 16;
      const mx = d3.max(keys, k => d3.max(Object.values(c.dec[k] || { 0: 0 }))), col = d3.scaleSequentialSqrt(seqRamp()).domain([0, mx]);
      if (!nwd) DEC.forEach((d, j) => { if (d % 40 === 20) g.append('text').attr('class', 'lbl').attr('x', hx + j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(`${d}`); });
      keys.forEach((k, i) => {
        const cy = i * rowH + (nwd ? 13 : 0), by = c.dec[k] || {}, colr = k === 'altro' ? css('--muted-mark') : SINGLE.includes(k) ? cols[0] : cols[3];
        if (nwd) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy - 2).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(labs[i]);
        g.append('path').attr('d', barPath(0, cy + (nwd ? 3 : 5), Math.max(2, x(c.n[k])), 13)).attr('fill', colr);
        g.append('text').attr('class', 'lbl').attr('x', x(c.n[k]) + 6).attr('y', cy + (nwd ? 13 : 15)).text(`${fmt(c.n[k])} · ${pct(c.n[k], all)}`);
        if (!nwd) DEC.forEach((d, j) => { const v = by[d] || 0;
          bindTip(g.append('rect').attr('x', hx + j * cw + 1).attr('y', cy + 2).attr('width', cw - 2).attr('height', rowH - 4).attr('rx', 3).attr('fill', v ? col(v) : css('--surface-2')).datum([k, d, v]),
            q => `<b>${esc(L(...TOPIC[q[0]]))}</b>` + trow(null, L(`Firmati negli anni ${q[1]}–${q[1] + 9}`, `Signed in ${q[1]}–${q[1] + 9}`), fmt(q[2]))); });
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', nwd ? w : lw + barW).attr('y', cy - (nwd ? 13 : 0)).attr('height', rowH).datum(k),
          kk => `<b>${esc(L(...TOPIC[kk]))}</b>` + trow(null, t('total'), `${fmt(c.n[kk])} · ${pct(c.n[kk], all)}`) + GK.filter(g2 => (c.kind[kk] || {})[g2]).map(g2 => trow(null, L(...GKS[g2]), fmt(c.kind[kk][g2]))).join(''));
      });
      note(el, ['normativa/<tipo>/<anno>/<numero>/intestazione.md'], fmt(all) + L(' atti', ' acts'),
        L('il gruppo si legge dalle parole iniziali del titolo, con le regole di src/prep.py applicate in quest’ordine: enti ecclesiastici (“Riconoscimento, agli effetti civili…”), enti morali e persone giuridiche, statuti, trattati, autorizzazioni, riforma fondiaria, ENEL, enti ospedalieri, scuole e università, comuni, conversioni, direttive, regolamenti. Ciò che nessuna regola riconosce resta in “Altre leggi, decreti e provvedimenti”.',

      table(el, [L('Gruppo', 'Group'), t('total'), ...DEC.map(d => `${d}–`)], keys.map(k => [L(...TOPIC[k]), c.n[k], ...DEC.map(d => (c.dec[k] || {})[d] || 0)]));
    }
  };
});

// 3. from signature to the Gazzetta Ufficiale
chart('c03', el => {
  const c = D.c03.cells, DEC = d3.range(1860, YEAR_LAST + 1, 10), rows = ['legge', 'dl', 'dlgs', 'dpr', 'regi', 'lgt', 'altri'];
  const cell = (k, d) => c[`${k}|${d}`];
  const ok = (k, d) => { const v = cell(k, d); return v && v[0] >= 10; };
  const dpr80 = cell('dpr', 1980), law20 = cell('legge', 2020), dl20 = cell('dl', 2020);
  return {
    title: L(`Dalla firma alla Gazzetta: ${fmt(dpr80[1])} giorni per i D.P.R. degli anni Ottanta, ${fmt(law20[1])} per le leggi degli anni 2020`,
      `From signature to the Gazzetta: ${fmt(dpr80[1])} days for presidential decrees of the 1980s, ${fmt(law20[1])} for laws of the 2020s`),
    toc: L('Dalla firma alla Gazzetta', 'From signature to the Gazzetta'),
    dek: L(`Per ogni atto in vigore, i giorni tra la sua data (la firma) e la pubblicazione nella Gazzetta Ufficiale: in ogni casella la mediana per tipo di atto e decennio della firma. I decreti-legge escono in Gazzetta il giorno stesso o il successivo (mediana ${fmt(dl20 ? dl20[1] : 0)} negli anni 2020); per le leggi l’attesa si è accorciata dai ${fmt(cell('legge', 1930)[1])} giorni degli anni Trenta; i D.P.R., spesso singoli provvedimenti, hanno atteso per decenni due o tre mesi.`,
      `For every act in force, the days between its date (the signature) and its publication in the Gazzetta Ufficiale: each cell gives the median by kind of act and decade of signature. Decree-laws appear in the Gazzetta the same day or the next (median ${fmt(dl20 ? dl20[1] : 0)} in the 2020s); for laws the wait has shortened from ${fmt(cell('legge', 1930)[1])} days in the 1930s; presidential decrees, often single measures, waited two or three months for decades.`),
    draw(el) {
      const w = W(el), nwd = narrow(w), labs = rows.map(k => L(...GKS[k]));
      const decs = nwd ? DEC.filter(d => d >= 1920) : DEC, lw = textW(el, labs) + 12, rowH = nwd ? 30 : 34, cw = (w - lw - 4) / decs.length;
      const m = { t: 22, l: lw }, h = m.t + rows.length * rowH + 6, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const col = d3.scaleSequentialLog(seqRamp()).domain([1, 120]).clamp(true);
      legend(el.insert('div', '.plot').style('margin-bottom', '6px'), [1, 7, 30, 90].map(v => ({ c: col(v), l: L(`${v} ${v === 1 ? 'giorno' : 'giorni'}`, `${v} ${v === 1 ? 'day' : 'days'}`) })));
      decs.forEach((d, j) => { if (!nwd || j % 2 === 0) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(`${d}`); });
      rows.forEach((k, i) => {
        const cy = i * rowH;
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(labs[i]);
        decs.forEach((d, j) => {
          const v = cell(k, d);
          if (!v) return;
          const fill = ok(k, d) ? col(Math.max(1, v[1])) : css('--surface-2');
          bindTip(g.append('rect').attr('x', j * cw + 1).attr('y', cy + 2).attr('width', cw - 2).attr('height', rowH - 4).attr('rx', 4).attr('fill', fill).datum([k, d, v]),
            q => `<b>${esc(L(...GKS[q[0]]))} · ${q[1]}–${q[1] + 9}</b>` + trow(null, L('Atti vigenti', 'Acts in force'), fmt(q[2][0])) + trow(null, L('Mediana (giorni)', 'Median (days)'), fmt(q[2][1])) +
              trow(null, L('Pubblicati entro il giorno dopo', 'Published by the next day'), pct(q[2][2], 1)) + (q[2][0] < 10 ? tq(L('meno di 10 atti: non colorata', 'fewer than 10 acts: not coloured')) : ''));
          if (ok(k, d) && cw >= 22) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'middle').style('fill', inkOn(fill)).style('pointer-events', 'none').text(fmt(v[1]));
        });
      });
      note(el, ['git log (Enacted:, Published:)', 'normativa/<tipo>/<anno>/<numero>/'], fmt(sum(Object.values(c), v => v[0])) + L(' atti', ' acts'),
        L(`la data dell’atto e quella della Gazzetta sono i trailer Enacted e Published del commit di ciascun atto; ${fmt(D.c03.bad)} atti senza una data utilizzabile (Gazzetta datata 1701 o 1702, o prima della firma) sono esclusi. Le caselle con meno di 10 atti sono grigie. Conta solo ciò che è in vigore oggi.`,
          `the act's date and the Gazzetta's are the Enacted and Published trailers of each act's commit; ${fmt(D.c03.bad)} acts without a usable date (a Gazzetta dated 1701 or 1702, or before the signature) are left out. Cells with fewer than 10 acts are grey. Only what is in force today counts.`));
      table(el, [L('Tipo', 'Kind'), ...DEC.map(String)], rows.map(k => [L(...GKS[k]), ...DEC.map(d => cell(k, d) ? `${fmt(cell(k, d)[1])} (${fmt(cell(k, d)[0])})` : '')]));
    }
  };
});

// 4. from the Gazzetta to entry into force
chart('c04', el => {
  const c = D.c04, keys = ['d0', 'd1', 'd2', 'd15', 'late'], ramp = seqRamp(), cols = S8();
  const colors = [ramp(0.25), ramp(0.5), ramp(0.7), cols[1], css('--muted-mark')];
  const names = [L('lo stesso giorno', 'the same day'), L('il giorno dopo', 'the next day'), L('da 2 a 14 giorni', '2–14 days'), L('il 15º giorno', 'the 15th day'), L('più tardi', 'later')];
  const RN = { conv: ['Leggi di conversione', 'Conversion laws'], ratif: ['Leggi di ratifica', 'Ratification laws'], legge: ['Altre leggi', 'Other laws'], dl: ['Decreti-legge', 'Decree-laws'],

  return {
    title: L(`Il giorno dopo o il quindicesimo: ${ilPct(lg.d15, n('legge'))} delle leggi ordinarie entra in vigore il 15º giorno, le conversioni e le ratifiche il giorno dopo`,
      `The next day or the fifteenth: ${pct(lg.d15, n('legge'))} of ordinary laws take effect on the 15th day, conversions and ratifications the next day`),
    toc: L('Il giorno dopo o il quindicesimo', 'The next day or the fifteenth'),
    dek: L(`La Costituzione (art. 73) fa entrare in vigore le leggi il quindicesimo giorno dopo la pubblicazione, salvo che la legge stabilisca un termine diverso. Per gli atti dal 1988 la Gazzetta annota il giorno di entrata in vigore: ogni barra divide gli atti di un tipo secondo i giorni trascorsi dalla Gazzetta. Le leggi di conversione e di ratifica entrano in vigore quasi tutte il giorno dopo, i decreti-legge il giorno stesso (${pct(c.rows.dl.d0, n('dl'))}) o il successivo (${pct(c.rows.dl.d1, n('dl'))}). Sotto, le altre leggi per decennio.`,
      `The Constitution (art. 73) makes laws take effect on the fifteenth day after publication, unless the law sets another term. For acts since 1988 the Gazzetta notes the day of entry into force: each bar splits the acts of one kind by the days that passed since the Gazzetta. Conversion and ratification laws nearly all take effect the next day, decree-laws the same day (${pct(c.rows.dl.d0, n('dl'))}) or the next (${pct(c.rows.dl.d1, n('dl'))}). Below, the other laws by decade.`),

      const lw = Math.min(nw ? 150 : 300, textW(el, [...rows.map(rl), ...drows.map(r => r.p)]) + 14), rw = textW(el, ['100' + PS()]) + 18;
      bands(el, rows, keys, colors, names, { label: rl, right: r => pct(r.d15 || 0, n(r.k)), rowH: 32, lw, rw });
      h4(el, L('Altre leggi, per decennio della firma', 'Other laws, by decade of signature'), 12);
      bands(el, drows, keys, colors, names, { label: r => r.p, right: r => pct(r.d15 || 0, sum(keys, q => r[q] || 0)), rowH: 30, lw, rw });
      note(el, ['normativa/<tipo>/<anno>/<numero>/intestazione.md (Entrata in vigore del provvedimento)', 'git log (Published:)'], fmt(c.n) + L(' atti dal 1988', ' acts since 1988'),
        L(`l’entrata in vigore è quella che la Gazzetta annota nell’intestazione dell’atto; la pubblicazione è il trailer Published. A destra la quota del 15º giorno. Leggi di conversione e di ratifica si riconoscono dal titolo. ${fmt(neg)} atti con una data di entrata in vigore anteriore alla Gazzetta sono esclusi. Solo atti in vigore oggi.`,
          `the entry into force is the one the Gazzetta notes in the act's heading; publication is the Published trailer. On the right, the share on the 15th day. Conversion and ratification laws are recognised by their title. ${fmt(neg)} acts with an entry into force before the Gazzetta are left out. Only acts in force today.`));
      table(el, [L('Tipo', 'Kind'), ...names, t('total')], [...rows.map(r => [L(...RN[r.k]), ...keys.map(k => r[k] || 0), n(r.k)]), ...drows.map(r => [L('Altre leggi ', 'Other laws ') + r.p, ...keys.map(k => r[k] || 0), sum(keys, k => r[k] || 0)])]);

});

part('p2', 'II. Il Governo legislatore', 'II. The Government as legislator',
  'Il decreto-legge è un atto del Governo con forza di legge, che le Camere devono convertire in legge entro sessanta giorni (art. 77 della Costituzione). I progetti di legge della Camera dal Regno a oggi, le schede delle leggi e i disegni di legge del Senato dicono quanti decreti sono stati presentati, quanto ha richiesto convertirli e quanti sono decaduti.',
  'A decree-law is an act of the Government with the force of law, which the Chambers must convert into law within sixty days (art. 77 of the Constitution). The Camera\'s bills from the Kingdom to today, the records of the laws and the Senate\'s bills tell how many decrees were presented, how long converting them took and how many lapsed.');

// 5. two waves of decree-laws
chart('c05', el => {

  const top1 = rows.filter(r => r.y < 1946).reduce((a, b) => a.n >= b.n ? a : b), top2 = rows.filter(r => r.y >= 1946).reduce((a, b) => a.n >= b.n ? a : b);
  const r3 = rows.filter(r => r.y >= 1993 && r.y <= 1996), rep3 = sum(r3, r => r.rep), n3 = sum(r3, r => r.n);

      `Decrees to convert: ${fmt(top1.n)} presented to the Camera in ${top1.y}, ${fmt(top2.n)} in ${top2.y}; in 1993–1996, ${pct(rep3, n3)} repeated an earlier one`),

    dek: L(`Ogni colonna è un anno: quanti decreti la Camera ha ricevuto con un disegno di legge di conversione (nel Regno anche regi decreti e decreti luogotenenziali, spesso più d’uno per disegno di legge). In arancione i decreti-legge il cui oggetto, nel titolo, ripete quello di un decreto presentato nei 400 giorni precedenti: il decreto non convertito veniva riemanato. La Corte costituzionale ha dichiarato illegittima questa reiterazione con la sentenza 360 del 1996; dal 1997 la Camera ha ricevuto in media ${dec(avgA, 0)} decreti l’anno.`,
      `Each column is one year: how many decrees the Camera received with a bill to convert them (under the Kingdom also royal decrees and lieutenancy decrees, often several to a bill). In orange, the decree-laws whose subject, in the title, repeats that of a decree presented in the previous 400 days: the unconverted decree was issued again. The Constitutional Court held such reiteration unconstitutional in judgment 360 of 1996; since 1997 the Camera has received ${dec(avgA, 0)} decrees a year on average.`),
    draw(el) {
      const ramp = cols[0], repC = cols[1];

      const all = d3.range(1910, YEAR_LAST + 1).map(y => ({ y, rep: get(y).rep, nw: get(y).n - get(y).rep }));
      const nw = narrow(W(el));
      const s = stackedColumns(el, all, ['nw', 'rep'], [ramp, repC], [L('decreto nuovo', 'new decree'), L('ripete un decreto precedente', 'repeats an earlier decree')],
        { pad: 0.1, mt: 44, h: 300, labelIf: r => r.y % (nw ? 20 : 10) === 0, partial: r => r.y === YEAR_LAST, xf: y => String(y) });
      const bx = y => s.x(y) + s.x.bandwidth() / 2;
      [[L('Regno d’Italia', 'Kingdom of Italy'), 1910, 1945], [L('Repubblica', 'Republic'), 1946, YEAR_LAST]].forEach(([lab, a, b], i) => {
        const x0 = s.x(a), x1 = s.x(b) + s.x.bandwidth();

      else rl.split(' ').forEach((part, i) => halo(s.g, xr + 5, ry + i * 13, part, 'start'));
      [top1, top2].forEach(r => { const xx = bx(r.y), yy = s.y(r.n), lab = `${r.y}: ${fmt(r.n)}`, tw = textW(el, [lab]);

        halo(s.g, xx, yy - 6, lab, anc); });
      note(el, ['parlamento/schede/camera/<legislatura>/', 'giurisprudenza/corte-costituzionale/1996/10/sentenza-360/'], fmt(sum(rows, r => r.n)) + L(' decreti', ' decrees'),
        L('un decreto è contato una volta, nell’anno in cui il disegno di legge che lo converte è stato presentato alla Camera per la prima volta (data e numero dal titolo); un disegno di legge che ne converte più d’uno senza indicarli conta come uno. “Ripete” vuol dire che le prime dodici parole del suo oggetto coincidono con quelle di un decreto presentato nei 400 giorni prima. I decreti presentati prima al Senato compaiono solo se il Senato li ha approvati; per il Regno la raccolta della Camera è incompleta.',
          'a decree is counted once, in the year the bill converting it was first presented to the Camera (date and number from the title); a bill converting several decrees without naming each counts as one. "Repeats" means the first twelve words of its subject match those of a decree presented in the previous 400 days. Decrees presented first to the Senate appear only if the Senate passed them; for the Kingdom the Camera\'s collection is incomplete.'));

// 6. sixty days

      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(decs.map(d => d[0])).range([0, iw]).padding(0.25), x2 = d3.scaleBand().domain([0, 1]).range([0, x.bandwidth()]).padding(0.12);
      const y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
      [0, .5, 1].forEach(v => { g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(v)).attr('y2', y(v)).attr('stroke', css('--grid')); g.append('text').attr('class', 'lbl mut').attr('x', -6).attr('y', y(v) + 4).attr('text-anchor', 'end').text(pv(100 * v)); });
      const sc = [cols[0], cols[6]];
      decs.forEach(([k, v]) => {

          g.append('path').attr('d', colPath(x(k) + x2(j), ih, x2.bandwidth(), y(s), 3)).attr('fill', sc[j]);
          if (!nwd) g.append('text').attr('class', 'lbl').attr('x', x(k) + x2(j) + x2.bandwidth() / 2).attr('y', y(s) - 4).attr('text-anchor', 'middle').style('font-size', '10px').text(pv(100 * s));

// 7. decree-laws by government
chart('c07', el => {

        d.append('div').attr('class', 'pv').html(`<b>${fmt(r.n)}</b> ${L('decreti', 'decrees')}`);
        d.append('div').attr('class', 'ps').text(L(`${dec(r.n / r.mo, 1)} al mese · ${pct(r.lapsed, r.n)} decaduti`, `${dec(r.n / r.mo, 1)} a month · ${pct(r.lapsed, r.n)} lapsed`) + (r.part ? L(' · fino al ' + dateShort(c.to), ' · to ' + dateShort(c.to)) : ''));
        const bar = d.append('div').attr('class', 'pbar');
        keys.forEach((k, i) => { if (r[k]) bar.append('i').style('flex', r[k]).style('background', colors[i]); });

      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      splitBars(el, rows, keys, colors, names, { label: r => govName(r.g) + (r.part ? ' *' : ''), rowH: 26, cap: 200, rr: 46,
        tipHead: d => trow(null, L('In carica dal', 'In office from'), dateTxt(d.s)) + trow(null, L('Mesi considerati', 'Months counted'), dec(d.mo, 1)) });
      const L13 = c.legs['13'] || {}, L14 = c.legs['14'] || {};
      note(el, ['parlamento/schede/senato/<legislatura>/fase-<id>.md (Natura, Iniziativa, Stato)', 'parlamento/atti-parlamentari/camera/votazioni/ (mozioni di fiducia)'], fmt(sum(rows, r => r.n)) + L(' decreti-legge', ' decree-laws'),
        L(`un decreto è contato una volta (data e numero dal titolo del disegno di legge); il governo è quello indicato nell’iniziativa, e il suo inizio è il voto sulla mozione di fiducia alla Camera o il suo primo disegno di legge, se precedente. * I dati del Senato si fermano ${pD('al', c.to)}: per il governo Meloni sono contati i mesi fino a quella data. Prima del 2006 il Senato non indica il governo: nella XIII legislatura (1996–2001) ${fmt(sum(Object.values(L13)))} decreti, ${fmt(L13.lapsed || 0)} decaduti; nella XIV (2001–2006) ${fmt(sum(Object.values(L14)))}, ${fmt(L14.lapsed || 0)} decaduti.`,

// 8. the Milleproroghe
chart('c08', el => {

  return {

      `The Milleproroghe: a year-end decree in ${k} of the last ${yrs.length} years, always converted ${mn} to ${mx} days later`),
    toc: L('Il Milleproroghe', 'The Milleproroghe'),
    dek: L(`Ogni riga è un anno: la barra va dalla data del decreto-legge di fine anno che proroga i termini in scadenza (“recante proroga di termini previsti da disposizioni legislative”, dal 2020 “termini legislativi” e “termini normativi”) alla legge che lo converte. Non c’è nel ${andList(miss.map(String))}. Il primo decreto con lo stesso titolo nelle leggi della Camera è ${pD('del', first.dl)}.`,
      `Each row is a year: the bar runs from the date of the year-end decree-law extending deadlines about to expire ("recante proroga di termini previsti da disposizioni legislative", since 2020 "termini legislativi" and "termini normativi") to the law converting it. There was none in ${andList(miss.map(String))}. The first decree with the same title among the Camera's laws is dated ${dateTxt(first.dl)}.`),
    draw(el) {
      const w = W(el), nwd = narrow(w), cols = S8(), rowH = nwd ? 20 : 22;
      const labs = yrs.map(y => byY(y) ? `${y} · ${L('D.L.', 'D.L.')} ${byY(y).n}` : String(y)), lw = textW(el, labs) + 12, rw = textW(el, [L('nessun decreto', 'no decree'), L('65 giorni', '65 days')]) + 12;
      const m = { t: 24, r: rw, b: 22, l: lw }, h = m.t + m.b + rowH * yrs.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 112]).range([0, iw]);   // days from 15 November
      const rel = (s, y) => (D2(s) - D2(`${y}-11-15`)) / 864e5;
      [['15 nov', '15 Nov', 0], ['1º dic', '1 Dec', 16], ['1º gen', '1 Jan', 47], ['1º feb', '1 Feb', 78], ['1º mar', '1 Mar', 106]].forEach(([a, b, d]) => {
        g.append('line').attr('x1', x(d)).attr('x2', x(d)).attr('y1', -6).attr('y2', rowH * yrs.length).attr('stroke', css('--grid'));
        if (!nwd || d > 0) g.append('text').attr('class', 'lbl mut').attr('x', x(d)).attr('y', -10).attr('text-anchor', 'middle').text(L(a, b));
      });
      yrs.forEach((y, i) => {
        const r = byY(y), cy = i * rowH;
        g.append('text').attr('class', r ? 'lbl strong' : 'lbl mut').attr('x', -8).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(labs[i]);
        if (!r) { g.append('text').attr('class', 'lbl mut').attr('x', iw + 6).attr('y', cy + rowH / 2 + 4).text(L('nessun decreto', 'no decree')); return; }
        const x0 = x(rel(r.dl, y)), x1 = x(rel(r.law, y)), bh = rowH - 9;
        g.append('path').attr('d', barPath(x0, cy + 4.5, x1, bh, 4)).attr('fill', r.days > 60 ? cols[1] : cols[0]);
        g.append('circle').attr('cx', x0).attr('cy', cy + rowH / 2).attr('r', 3.2).attr('fill', css('--surface')).attr('stroke', cols[0]).attr('stroke-width', 1.5);
        g.append('text').attr('class', 'lbl').attr('x', iw + 6).attr('y', cy + rowH / 2 + 4).text(L(`${r.days} giorni`, `${r.days} days`));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
          d => `<b>${L('Decreto-legge', 'Decree-law')} ${dateTxt(d.dl)}, n. ${d.n}</b>${tq(d.title)}` + trow(null, L('Convertito dalla legge', 'Converted by law'), `${dateTxt(d.law)}, n. ${d.lawn}`) +
            trow(null, L('Giorni', 'Days'), fmt(d.days)) + trow(null, L('Con modificazioni', 'With amendments'), d.mod ? L('sì', 'yes') : L('no', 'no')));
      });
      legend(el, [{ c: cols[0], l: L('dal decreto (cerchio) alla legge di conversione', 'from the decree (circle) to the conversion law') }, { c: cols[1], l: L('oltre 60 giorni dalla data del decreto', 'over 60 days from the decree\'s date') }]);
      note(el, ['parlamento/schede/leggi/<anno>/<mese>/legge-<n>.md (titolo)'], fmt(rows.length) + L(' decreti', ' decrees'),
        L('sono contati i decreti-legge datati dal 15 novembre al 31 dicembre il cui oggetto, nel titolo della legge di conversione, è solo la proroga di termini (regola in src/prep.py); i decreti di proroga su un singolo tema, o di altri mesi, non sono contati. Tutti sono stati convertiti con modificazioni.',
          'counted are the decree-laws dated 15 November to 31 December whose subject, in the conversion law\'s title, is only the extension of deadlines (rule in src/prep.py); extensions on a single subject, or of other months, are not counted. All were converted with amendments.'));
      table(el, [L('Decreto-legge', 'Decree-law'), L('Legge di conversione', 'Conversion law'), L('Giorni', 'Days'), L('Oggetto', 'Subject')], R.map(r => [`${r.dl}, n. ${r.n}`, `${r.law}, n. ${r.lawn}`, r.days, r.title]));
    }
  };
});

part('p3', 'III. Il Parlamento', 'III. Parliament',
  'Le schede delle leggi e dei progetti di legge della Camera (dal 1946), i disegni di legge del Senato (dal 1996), e ogni votazione elettronica della Camera dal 1996: che cosa approva il Parlamento, chi propone le leggi, quante volte il Governo chiede la fiducia e quando si firmano le leggi.',
  'The records of the Camera\'s laws and bills (since 1946), the Senate\'s bills (since 1996), and every electronic vote of the Camera since 1996: what Parliament passes, who proposes laws, how often the Government asks for confidence and when laws are signed.');

// 9. what Parliament passes
chart('c09', el => {
  const rows = D.c09.rows, legs = D.legs, cols = S8(), keys = ['conv', 'ratif', 'budget', 'delega', 'other'];
  const colors = [cols[0], cols[2], cols[3], cols[6], css('--muted-mark')];
  const names = [L('conversioni di decreti-legge', 'conversions of decree-laws'), L('ratifiche di trattati', 'ratifications of treaties'), L('bilancio e finanza pubblica', 'budget and public finance'), L('deleghe al Governo', 'delegations to the Government'), L('altre leggi', 'other laws')];
  const tot = r => sum(keys, k => r[k] || 0), first = rows[0], last = rows[rows.length - 1];
  const span = k => { const i = legs.findIndex(l => l[0] === k); return `${legs[i][1].slice(0, 4)}–${legs[i + 1] ? legs[i + 1][1].slice(0, 4) : ''}`; };
  const prev = rows[rows.length - 2];
  return {
    title: L(`Che cosa approva il Parlamento: ${ilPct(last.conv, tot(last))} delle leggi della XIX legislatura converte un decreto-legge, ${ilPct(first.conv, tot(first)).trim()} nella I`,

    toc: L('Che cosa approva il Parlamento', 'What Parliament passes'),
    dek: L(`Ogni barra è una legislatura: le leggi approvate, per oggetto letto dal titolo. Nella I legislatura (1948–1953) il Parlamento approvò ${fmt(tot(first))} leggi, nella XVIII ${fmt(tot(prev))}; le leggi “altre”, quelle che non convertono un decreto, non ratificano un trattato né riguardano il bilancio, passano ${prepPct('da', first.other, tot(first))} ${prepPct('a', prev.other, tot(prev))}.`,
      `Each bar is a legislature: the laws passed, by subject read from the title. In the I legislature (1948–1953) Parliament passed ${fmt(tot(first))} laws, in the XVIII ${fmt(tot(prev))}; "other" laws, those that convert no decree, ratify no treaty and are not about the budget, went from ${pct(first.other, tot(first))} to ${pct(prev.other, tot(prev))}.`),
    draw(el) {
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      bands(el, rows, keys, colors, names, { label: (r, nw) => nw ? ROM(r.leg) : `${ROM(r.leg)} · ${span(r.leg)}`, right: r => fmt(tot(r)), rowH: 28, partial: r => r === last, minIn: 30 });
      note(el, ['parlamento/schede/leggi/<anno>/<mese>/legge-<n>.md', 'parlamento/schede/camera/<legislatura>/ (inizio delle legislature)'], fmt(sum(rows, tot)) + L(' leggi', ' laws'),
        L(`l’oggetto si legge dal titolo della legge, senza i nomi dei proponenti: “Conversione in legge…”, “Ratifica ed esecuzione…”, bilancio, rendiconto, assestamento, legge finanziaria o di stabilità, esercizio provvisorio, e “Delega al Governo…”; il resto è “altre leggi”. Le leggi costituzionali non sono contate. La legislatura di una legge è quella in corso alla sua data (l’inizio è il primo giorno con almeno dieci progetti di legge presentati alla Camera). La XIX è in corso (più chiara).`,
          `the subject is read from the law's title, without the names of the proposers: "Conversione in legge…", "Ratifica ed esecuzione…", the budget, accounts, adjustment, finance or stability law, provisional budget, and "Delega al Governo…"; the rest is "other laws". Constitutional laws are not counted. A law's legislature is the one in progress on its date (the start is the first day with at least ten bills presented to the Camera). The XIX is in progress (lighter).`));
      table(el, [t('leg'), ...names, t('total')], rows.map(r => [`${ROM(r.leg)} (${span(r.leg)})`, ...keys.map(k => r[k] || 0), tot(r)]));
    }
  };
});

// 10. who proposes, who gets passed
chart('c10', el => {

  const P = [['gov', L('Governo (esclusi i decreti-legge)', 'Government (not decree-laws)'), cols[0]], ['conv', L('Conversioni di decreti-legge', 'Conversions of decree-laws'), cols[6]],
    ['mp', L('Deputati e senatori', 'Deputies and senators'), cols[1]]];
  const T = k => [sum(legs, l => (c[l][k] || [0, 0])[0]), sum(legs, l => (c[l][k] || [0, 0])[1])];
  const g0 = T('gov'), m0 = T('mp'), cv = T('conv'), ot = T('other');

    title: L(`Chi propone e chi ottiene: dal 2006 è diventato legge ${ilPct(g0[1], g0[0])} dei disegni di legge del Governo, ${ilPct(m0[1], m0[0], 1).trim()} delle proposte dei parlamentari`,
      `Who proposes and who gets passed: since 2006, ${pct(g0[1], g0[0])} of Government bills have become law, ${pct(m0[1], m0[0], 1)} of members' bills`),
    toc: L('Chi propone e chi ottiene', 'Who proposes and who gets passed'),

      `For each legislature since 2006, the bills presented to the Camera or the Senate (light column) and those that became law (solid column), by who proposed them. Deputies and senators present ${pct(m0[0], m0[0] + g0[0] + cv[0] + ot[0])} of the bills, but their laws number ${fmt(m0[1])} against the Government's ${fmt(g0[1] + cv[1])}, conversions included.`),

      const panes = P.map(() => box.append('div'));

        const p = panes[pi], tt = T(k);
        p.append('h4').text(name);
        p.append('p').text(L(`${fmt(tt[1])} leggi su ${fmt(tt[0])} (${pct(tt[1], tt[0], 1)})`, `${fmt(tt[1])} laws of ${fmt(tt[0])} (${pct(tt[1], tt[0], 1)})`));
        const w = W(p), h = 200, m = { t: 18, r: 4, b: 22, l: 44 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(legs).range([0, iw]).padding(0.24);
        const y = d3.scaleLinear().domain([0, d3.max(legs, l => (c[l][k] || [0])[0])]).nice().range([ih, 0]);
        yAxis(g, y, iw, 4);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        legs.forEach(l => {
          const [n, law] = c[l][k] || [0, 0], x0 = x(l), bw = x.bandwidth(), op = l === legs[legs.length - 1] ? .55 : 1;
          g.append('path').attr('d', colPath(x0, ih, bw, y(n))).attr('fill', ink).attr('fill-opacity', .22 * op);
          g.append('path').attr('d', colPath(x0, ih, bw, y(law))).attr('fill', ink).attr('fill-opacity', op);
          g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', y(n) - 5).attr('text-anchor', 'middle').text(pct(law, n));
          g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', ih + 15).attr('text-anchor', 'middle').text(ROM(+l));

            q => `<b>${name} · ${ROM(+q)} ${L('legislatura', 'legislature')}${q === legs[legs.length - 1] ? L(' (fino al ', ' (to ') + dateShort(D.c10.to) + ')' : ''}</b>` +
              trow(null, L('Presentati', 'Presented'), fmt((c[q][k] || [0])[0])) + trow(ink, L('Diventati legge', 'Became law'), fmt((c[q][k] || [0, 0])[1])) + trow(null, t('share'), pct((c[q][k] || [0, 0])[1], (c[q][k] || [0])[0], 1)));
        });
      });
      note(el, ['parlamento/schede/senato/<legislatura>/fase-<id>.md (Iniziativa, Natura, Stato, Legge n.)'], fmt(sum(['gov', 'conv', 'mp', 'other'], k => T(k)[0])) + L(' disegni di legge', ' bills'),
        L(`un disegno di legge è contato una volta (l’identificativo del Senato raccoglie le sue fasi nelle due Camere); l’iniziativa è quella della prima fase che la indica. Altri ${fmt(ot[0])} progetti vengono da regioni, CNEL o cittadini (${fmt(ot[1])} leggi). I dati del Senato si fermano ${pD('al', D.c10.to)}: la XIX legislatura è incompleta (più chiara); per le legislature precedenti alla XV il Senato non indica l’iniziativa.`,
          `a bill is counted once (the Senate's identifier groups its phases in the two Chambers); the initiative is that of the first phase that names it. Another ${fmt(ot[0])} bills come from regions, the CNEL or citizens (${fmt(ot[1])} laws). The Senate's data stop on ${dateTxt(D.c10.to)}: the XIX legislature is incomplete (lighter); for legislatures before the XV the Senate does not give the initiative.`));
      table(el, [t('leg'), ...P.flatMap(p => [p[1] + L(': presentati', ': presented'), L('leggi', 'laws')])], legs.map(l => [ROM(+l), ...P.flatMap(p => c[l][p[0]] || [0, 0])]));

// 11. the questione di fiducia in the Camera
chart('c11', el => {
  const V = D.c11.votes, cols = S8(), KK = ['conv', 'emend', 'other', 'mot'];
  const KC = { conv: cols[0], emend: cols[1], other: cols[2], mot: css('--muted-mark') };
  const KN = { conv: [L('articolo di una legge di conversione', 'article of a conversion bill')], emend: [L('emendamento del Governo (maxi-emendamento)', 'Government amendment (maxi-amendment)')],
    other: [L('articolo di un’altra legge', 'article of another bill')], mot: [L('mozione o risoluzione (anche sulla fiducia al Governo)', 'motion or resolution (incl. confidence in the Government)')] };
  const govs = [['XIV', '2001-06-21', D.govs[0][1]], ...D.govs.map(g => [g[0], g[1], g[2]])];
  const grp = govs.map(([g, s, e]) => { const vs = V.filter(v => v[0] >= s && (!e || v[0] < e)), end = e || D.c11.to, mo = (D2(end) - D2(s)) / (30.4375 * 864e5);
    const o = {}; KK.forEach(k => o[k] = vs.filter(v => v[1] === k).length); return { g, s, e, n: vs.length, mo, ...o }; });
  const last = grp[grp.length - 1], bills = r => r.conv + r.emend + r.other;
  const rate = grp.slice(1).sort((a, b) => b.n / b.mo - a.n / a.mo)[0];
  const gname = g => g === 'XIV' ? L('XIV legislatura', 'XIV legislature') : govName(g);
  return {
    title: L(`La questione di fiducia: ${fmt(V.length)} voti alla Camera dal 2001; con il governo ${govName(last.g)} ${fmt(last.n)}, ${fmt(last.conv)} su leggi di conversione`,
      `The questione di fiducia: ${fmt(V.length)} votes in the Camera since 2001; under the ${govName(last.g)} government ${fmt(last.n)}, ${fmt(last.conv)} on conversion bills`),
    toc: L('La questione di fiducia', 'The questione di fiducia'),
    dek: L(`Ponendo la questione di fiducia su un testo, il Governo ne chiede l’approvazione senza modifiche e si dimette se è respinto. Ogni punto è un voto della Camera con la fiducia, per semestre e secondo l’oggetto. Fino al 2011 la fiducia cadeva spesso su un emendamento del Governo che riscriveva l’intero testo; dal 2013 cade soprattutto sull’articolo unico delle leggi di conversione. Il ritmo più alto è quello del governo ${govName(rate.g)}: ${dec(rate.n / rate.mo, 1)} voti al mese.`,
      `By attaching the question of confidence to a text, the Government asks for its approval without amendments and resigns if it is rejected. Each dot is a Camera vote with confidence attached, by half-year and by subject. Until 2011 confidence often fell on a Government amendment rewriting the whole text; since 2013 mostly on the single article of conversion bills. The highest rate is the ${govName(rate.g)} government's: ${dec(rate.n / rate.mo, 1)} votes a month.`),
    draw(el) {
      const cards = el.append('div').attr('class', 'ptiles');
      grp.forEach(r => {
        const d = cards.append('div').attr('class', 'ptile');
        d.append('div').attr('class', 'pn').text(r.g === 'XIV' ? L('XIV legislatura · 2001–2006', 'XIV legislature · 2001–2006') : `${govName(r.g)} · ${r.s.slice(0, 4)}–${r.e ? r.e.slice(0, 4) : ''}`);
        d.append('div').attr('class', 'pv').html(`<b>${fmt(r.n)}</b> ${L(r.n === 1 ? 'voto' : 'voti', r.n === 1 ? 'vote' : 'votes')}`);
        d.append('div').attr('class', 'ps').text(L(`${dec(r.n / r.mo, 1)} al mese`, `${dec(r.n / r.mo, 1)} a month`));
        const bar = d.append('div').attr('class', 'pbar');
        KK.forEach(k => { if (r[k]) bar.append('i').style('flex', r[k]).style('background', KC[k]); });
      });
      legend(el, KK.map(k => ({ c: KC[k], l: KN[k][0], shape: 'dot' })));
      const w = W(el), nw = narrow(w);
      const bins = new Map();
      V.forEach(v => { const [y, mo] = v[0].split('-').map(Number), key = y + (mo >= 7 ? .5 : 0); if (!bins.has(key)) bins.set(key, []); bins.get(key).push(v); });
      const maxN = d3.max([...bins.values()], b => b.length), step = nw ? 5 : 7, r = nw ? 2.1 : 3;
      const m = { t: 30, r: 8, b: 24, l: 8 }, ih = maxN * step + 6, h = m.t + m.b + ih;
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x = d3.scaleLinear().domain([2001.4, YEAR_LAST + 1]).range([0, iw]);
      govs.forEach(([gname0, s, e], i) => {
        const x0 = x(Math.max(2001.4, fy(s))), x1 = x(e ? fy(e) : YEAR_LAST + 1);
        if (i % 2 === 0) g.append('rect').attr('x', x0).attr('width', x1 - x0).attr('y', -m.t + 4).attr('height', ih + m.t - 4).attr('rx', 6).attr('fill', css('--surface-2'));
        const full = gname0 === 'XIV' ? 'XIV' : govName(gname0), lab = textW(el, [full], 'lbl mut') < x1 - x0 - 4 ? full : full.split(' ')[0], tw = textW(el, [lab], 'lbl mut');
        if (tw < x1 - x0 - 4) g.append('text').attr('class', 'lbl mut').attr('x', (x0 + x1) / 2).attr('y', -14).attr('text-anchor', 'middle').text(lab);
      });
      d3.range(2002, YEAR_LAST + 1, nw ? 6 : 2).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      const ORD = { conv: 0, emend: 1, other: 2, mot: 3 }, pts = [];
      bins.forEach((vs, key) => { const cx = x(key + .25); vs.sort((a, b) => ORD[a[1]] - ORD[b[1]] || a[0].localeCompare(b[0])).forEach((v, k) => pts.push({ v, cx, cy: ih - 4 - k * step })); });
      bindTip(g.append('g').selectAll('circle').data(pts).join('circle').attr('cx', p => p.cx).attr('cy', p => p.cy).attr('r', r).attr('fill', p => KC[p.v[1]]),
        p => `<b>${dateTxt(p.v[0])}</b>${tq(p.v[6])}` + trow(KC[p.v[1]], L('Oggetto', 'Object'), KN[p.v[1]][0]) + trow(null, L('Favorevoli', 'Yes'), fmt(p.v[4])) + trow(null, L('Contrari', 'No'), fmt(p.v[5])) +
          (p.v[3] ? trow(null, L('Governo', 'Government'), govName(p.v[3])) : ''));
      note(el, ['parlamento/atti-parlamentari/camera/votazioni/repubblica_<n>/<anno>/<mese>/<giorno>/*.md (richiestaFiducia)'], fmt(V.length) + L(' votazioni', ' votes'),
        L(`sono le votazioni elettroniche della Camera con richiestaFiducia = 1; nei dati della XIII legislatura (1996–2001) il campo non è mai valorizzato, perciò la serie parte dal 2001. L’oggetto si legge dal tipo e dalla descrizione del voto. I governi sono quelli del grafico 7; per il 2001–2006 i dati non nominano il governo. Al mese: voti divisi per i mesi in carica, fino ${pD('al', D.c11.to)} per l’ultimo.`,
          `these are the Camera's electronic votes with richiestaFiducia = 1; in the data of the XIII legislature (1996–2001) the field is never set, so the series starts in 2001. The subject is read from the vote's type and description. Governments are those of chart 7; for 2001–2006 the data do not name the government. Per month: votes divided by months in office, up to ${dateTxt(D.c11.to)} for the last one.`));
      table(el, [L('Data', 'Date'), L('Oggetto', 'Object'), L('Favorevoli', 'Yes'), L('Contrari', 'No'), L('Descrizione', 'Description')], V.map(v => [v[0], KN[v[1]][0], v[4], v[5], v[6]]));
    }
  };
});

// 12. the calendar of the laws

      `Each square is a day of the year: how many laws the President of the Republic promulgated on that day from ${c.y0} to ${c.y1}. Laws cluster before the summer break (July and the first half of August) and in December, with the budget; September, when the Chambers return after the summer, counts ${fmt(sept)} of ${fmt(n)}. Below, the month and weekday of the signature and the weekday of publication in the Gazzetta.`),
    draw(el) {
      const lgBox = el.append('div');

      const ramp = seqRamp();
      legend(lgBox, [20, 50, 100, 150].map(v => ({ c: cal.cl(v), l: v === 150 ? L(`${fmt(v)} leggi`, `${fmt(v)} laws`) : fmt(v) })).concat([{ c: ramp(1), l: `${dayMonth(+top[0].slice(0, 2), +top[0].slice(3))}: ${fmt(top[1])}` }]));
      const cols = S8(), nwd = narrow(W(el));
      const box = el.append('div').attr('class', 'mini').style('margin-top', '12px').style('grid-template-columns', `repeat(${nwd ? 1 : 3}, minmax(0, 1fr))`);
      const MON = d3.range(1, 13).map(m => c.mon[String(m).padStart(2, '0')] || 0);
      [[MON, L('Mese della firma', 'Month of signature'), MSH[LANG], n], [c.wd, L('Giorno della settimana della firma', 'Weekday of signature'), DOWS[LANG], sum(c.wd)],
       [c.wdp, L('Giorno della settimana della Gazzetta', 'Weekday of the Gazzetta'), DOWS[LANG], sum(c.wdp)]].forEach(([v, lab, ticks, tt]) => {

        const x = d3.scaleBand().domain(d3.range(v.length)).range([0, ww]).padding(0.22), y = d3.scaleLinear().domain([0, d3.max(v)]).range([hh - 36, 0]), mxv = d3.max(v);
        v.forEach((s, q) => {
          g2.append('path').attr('d', colPath(x(q), hh - 36, x.bandwidth(), y(s), 3)).attr('fill', s === mxv ? cols[1] : cols[0]).attr('opacity', s === mxv ? 1 : .75);
          if (v.length <= 7 || !nwd) g2.append('text').attr('class', 'lbl').attr('x', x(q) + x.bandwidth() / 2).attr('y', y(s) - 4).attr('text-anchor', 'middle').style('font-size', v.length > 7 ? '9px' : '11px').text(pct(s, tt));
          g2.append('text').attr('class', 'lbl').attr('x', x(q) + x.bandwidth() / 2).attr('y', hh - 22).attr('text-anchor', 'middle').text(ticks[q]);
          bindTip(g2.append('rect').attr('class', 'hit').attr('x', x(q)).attr('width', x.bandwidth()).attr('y', -16).attr('height', hh - 20).datum([q, s]),
            p => `<b>${v.length > 7 ? MESI[p[0]] : DOW[LANG][p[0]]}</b>` + trow(null, L('Leggi', 'Laws'), `${fmt(p[1])} · ${pct(p[1], tt)}`));

      table(el, [L('Giorno', 'Day'), L('Leggi', 'Laws'), t('share')], c.top.map(([k, v]) => [dayMonth(+k.slice(0, 2), +k.slice(3)), v, pct(v, n, 1)]));
    }
